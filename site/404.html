<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<title>Not found — Cole Calfee</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
/* Served by Cloudflare Pages with status 404 for any path that is not part of the site.
   Tokens, header, nav and footer are the About page's, unchanged. */
:root{--paper:#fff;--ink:#111;--muted:#626262;--rule:#d9d9d9;--accent:#a43f33;--sans:"Helvetica Neue",Helvetica,Arial,sans-serif;--mono:Monaco,Menlo,"SFMono-Regular",Consolas,monospace}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
a:hover{color:var(--accent)}
html,body{height:100%;overflow:hidden}
.shell{width:min(1440px,calc(100% - 76px));margin:0 auto;height:100svh;display:flex;flex-direction:column}
.site-head{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:35px 0 28px;border-bottom:1px solid var(--rule)}
.brand{font-size:16px;line-height:1;letter-spacing:-.02em}
.nav{display:flex;gap:25px;align-items:center;font-size:15px;line-height:1;letter-spacing:-.025em;white-space:nowrap}
.nav a{padding-bottom:5px}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:30px 0 32px}
.missing{width:min(1050px,100%);display:flex;justify-content:space-between;align-items:flex-start;gap:48px}
.missing h1{margin:0;font:400 24px/1.13 var(--sans);letter-spacing:-.033em}
.note{margin:9px 0 0;color:var(--muted);font:400 10px/1.4 var(--mono);letter-spacing:.04em;text-transform:uppercase}
.onward{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.onward .eyebrow{font:400 10px/1.4 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.onward a{font:400 15px/1.3 var(--sans);letter-spacing:-.02em;border-bottom:1px solid var(--rule);padding-bottom:3px;white-space:nowrap}
.footer{flex-shrink:0;border-top:1px solid var(--rule);padding:17px 0 24px;color:var(--muted);font:400 11px/1.4 var(--mono);letter-spacing:.04em;text-transform:uppercase}
@media(max-width:700px){
 .shell{width:calc(100% - 40px)}
 .site-head{padding:23px 0 19px;gap:10px}
 .brand{font-size:14px}
 .nav{gap:16px;font-size:13px}
 .nav a{padding-bottom:4px}
 .missing{display:block}
 .missing h1{font-size:23px}
 .note{margin-top:8px;font-size:9px;line-height:1.6}
 .onward{margin-top:25px;padding-top:16px;border-top:1px solid var(--rule);gap:9px}
 .onward .eyebrow{font-size:9px}
 .onward a{font-size:13px;align-self:flex-start}
 .footer{padding:13px 0 17px;font-size:10px}
}
@media(max-width:359px){
 .shell{width:calc(100% - 32px)}
 .nav{font-size:12px;gap:11px}
}
</style>
<style>html[data-tone="graphite"]{--paper:#242628;--ink:#f1f1ef;--muted:#b7babc;--rule:#505457;--accent:#f1f1ef}html[data-tone="graphite"] body{background:var(--paper);color:var(--ink)}</style>
<script src="/assets/js/site.js?v=8"></script>
</head>
<body>
<div class="shell">
  <header class="site-head">
    <a class="brand" href="/">Cole Calfee</a>
    <nav class="nav" aria-label="Primary navigation">
      <a href="/index/">Index</a>
      <a href="/paintings/">Available</a>
      <a href="/info/">About</a>
    </nav>
  </header>
  <main id="not-found">
    <section class="missing" aria-labelledby="missing-title">
      <div>
        <h1 id="missing-title">Not found</h1>
        <p class="note">This page is not part of the archive.</p>
      </div>
      <div class="onward">
        <span class="eyebrow">Continue</span>
        <a href="/index/">The full Index</a>
      </div>
    </section>
  </main>
  <footer class="footer">© 2026 Cole Calfee</footer>
</div>
</body>
</html>
