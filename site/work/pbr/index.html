<style>
/* Colourways. The default is set here; the other applies when the visitor chooses it. */
:root{--paper:#f8f8f6;--ink:#171717}
:root[data-colorway="earth"]{--paper:#473931;--ink:#e9e0d6;color-scheme:dark}
/* The switch is one more word in each page's row of links: DARK, or LIGHT when brown.

.cwt{display:none;margin:-14px 0;padding:14px 0;border:0;background:none;color:inherit;font:inherit;letter-spacing:inherit;text-transform:uppercase;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}

.cwt:focus-visible{outline:none}
.cwt:focus-visible span{outline:1px solid currentColor;outline-offset:5px}
</style>

<script>
(function(){
  var r=document.documentElement,m=document.querySelector('meta[name="theme-color"]'),bg={paper:"#f8f8f6",earth:"#473931"};
  function set(c,save){
    c=c==="earth"?"earth":"paper";
    if(c==="earth")r.dataset.colorway=c;else delete r.dataset.colorway;
    if(m)m.setAttribute("content",bg[c]);
    if(save)try{localStorage.setItem("colorway",c)}catch(e){}
  }
  function stored(){try{return localStorage.getItem("colorway")}catch(e){}}
  [].forEach.call(document.querySelectorAll(".cwt"),function(b){b.addEventListener("click",function(){set(r.dataset.colorway==="earth"?"paper":"earth",true)})});
  addEventListener("storage",function(e){if(e.key==="colorway")set(e.newValue)});
  addEventListener("pageshow",function(){set(stored())});
  set(stored());
})();
</script>
