name: Final website release QA

on:
  push:
    branches: [main, release/final-qa-20261029]
    paths:
      - "tests/site/release.e2e.cjs"
      - ".github/workflows/release-qa.yml"
  pull_request:
    branches: [main]
    paths:
      - "tests/site/release.e2e.cjs"
      - ".github/workflows/release-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-and-interaction:
    name: Real-browser desktop and iPhone QA
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test runner
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run live production release checks
        env:
          BASE_URL: https://colecalfee.com
          SCREENSHOTS: release-screenshots
        run: node tests/site/release.e2e.cjs
      - name: Save screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-screenshots
          path: release-screenshots/
          if-no-files-found: ignore
