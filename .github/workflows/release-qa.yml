name: Site QA

# site/ is the published site, built from src/ by `npm run build`.
# Every change checks that site/ matches src/, tests every page in a real
# browser at phone, tablet and desktop widths, checks routing under
# Cloudflare's own Pages server, and finally checks the real deployment.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

env:
  PLAYWRIGHT: playwright@1.56.1
  WRANGLER: wrangler@3.114.0
  PAGES_SUBDOMAIN: personal-7jh.pages.dev

jobs:
  build:
    name: site/ is built from src/
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Committed site/ matches a fresh build
        run: |
          git status --porcelain -- site MEDIA-REPORT.md
          test -z "$(git status --porcelain -- site MEDIA-REPORT.md)" || { echo "::error::site/ is out of date. Run npm run build and commit site/."; exit 1; }

  browser:
    name: Every page at 375, 390, 430, 768 and 1440px
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --no-package-lock "$PLAYWRIGHT"
      - run: npx playwright install --with-deps chromium
      - name: Serve site/ as committed
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory site > /tmp/server.log 2>&1 &
          sleep 2
      - name: Browser QA
        env:
          BASE_URL: http://127.0.0.1:4173
          SCREENSHOTS: release-screenshots
        run: node tests/site.e2e.cjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-screenshots
          path: release-screenshots/
          if-no-files-found: ignore

  routing:
    name: Routing under Cloudflare's Pages server
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Serve with wrangler pages dev (reads wrangler.toml, _redirects, _headers, 404.html)
        run: |
          npm install --no-save --no-package-lock "$WRANGLER"
          CI=1 npx wrangler pages dev --port 8788 --ip 127.0.0.1 > /tmp/wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -fs -o /dev/null http://127.0.0.1:8788/ && break; sleep 1; done
      - run: node tests/routes.e2e.cjs
        env:
          BASE_URL: http://127.0.0.1:8788

  deployed:
    name: Routing on the real Cloudflare deployment
    needs: [build, browser, routing]
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wait for Cloudflare Pages to deploy this commit
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          for i in $(seq 1 90); do
            run=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?check_name=Cloudflare%20Pages" \
              --jq '.check_runs | sort_by(.started_at) | last | [.status, (.conclusion // ""), (.details_url // "")] | @tsv' || true)
            status=$(cut -f1 <<<"$run"); conclusion=$(cut -f2 <<<"$run"); details=$(cut -f3 <<<"$run")
            if [ "$status" = "completed" ]; then
              echo "Cloudflare Pages: $conclusion ($details)"
              [ "$conclusion" = "success" ] || { echo "::error::Cloudflare Pages did not deploy this commit ($conclusion)."; exit 1; }
              if [ "${{ github.event_name }}" = "pull_request" ]; then
                id=$(basename "$details"); echo "url=https://${id:0:8}.${PAGES_SUBDOMAIN}" >> "$GITHUB_OUTPUT"
              else
                echo "url=https://colecalfee.com" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for the Cloudflare Pages deployment."; exit 1
      - name: Routing on ${{ steps.pages.outputs.url }}
        env:
          BASE_URL: ${{ steps.pages.outputs.url }}
          ROUTES_ATTEMPTS: "10"
          ROUTES_RETRY_MS: "30000"
        run: node tests/routes.e2e.cjs
