<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Prints — Cole Calfee</title>
<link rel="stylesheet" href="../assets/css/site.css">
<style>
body{font-family:var(--mono)}
.shop{min-height:100dvh;display:flex;flex-direction:column;padding:24px;gap:25px}
.shop header,.shop footer{display:flex;justify-content:space-between;font:11px var(--mono)}
.shop main{flex:1;display:flex;flex-direction:column;justify-content:center}
.shop .meta{display:flex;justify-content:space-between;color:var(--muted);font:10px var(--mono);margin-bottom:16px}
.shop .prints{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.shop figure{margin:0}
.shop .art{aspect-ratio:8.5/11;background:#eae5d9;display:grid;place-items:center;color:var(--muted);border:1px solid var(--rule);font:11px var(--mono);max-height:55dvh}
.shop figcaption{display:flex;justify-content:space-between;gap:10px;font:10px var(--mono);margin-top:12px}
.shop aside{border-top:1px solid var(--rule);padding-top:20px;display:flex;justify-content:space-between;gap:30px;font:11px/1.6 var(--mono)}
.shop .muted{color:var(--muted)}
@media(max-width:700px){.shop{padding:16px}.shop .prints{gap:7px}.shop figcaption{display:block;font-size:9px}.shop aside{display:block}.shop .art{font-size:9px}}
</style>
</head>
<body>
<div class="shop">
<header><a href="../">COLE CALFEE</a><span>PRINTS / STUDY 001</span></header>
<main>
<div class="meta"><span>RELEASE 001</span><span>THREE WORKS</span></div>
<div class="prints">
<figure><div class="art">01</div><figcaption>PRINT 01 <span class="muted">PENDING</span></figcaption></figure>
<figure><div class="art">02</div><figcaption>PRINT 02 <span class="muted">PENDING</span></figcaption></figure>
<figure><div class="art">03</div><figcaption>PRINT 03 <span class="muted">PENDING</span></figcaption></figure>
</div>
</main>
<aside><div>THREE PRINTS. ONE RELEASE. EVERY MONTH.<p class="muted">ARCHIVAL PRINTS / 8.5 × 11 IN. PAPER</p></div><div>SHOPIFY CONNECTION: PENDING<p class="muted">CHECKOUT DISABLED IN DESIGN STUDY</p></div></aside>
<footer><span>NOT FOR SALE / PRIVATE STUDY</span><a href="../">BACK TO SITE</a></footer>
</div>
</body>
</html>
