<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cole Calfee</title>
<meta name="description" content="Cole Calfee — photography, design, and artwork.">
<style>
:root{
  --paper:#f5f3ed;
  --ink:#171715;
  --quiet:#77736b;
  --rule:#cbc7bd;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{
  font-family:"Iowan Old Style",Baskerville,"Times New Roman",serif;
  font-size:15px;
  line-height:1.3;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
.page{
  height:100svh;
  min-height:680px;
  width:min(1180px,calc(100% - 48px));
  margin:auto;
  padding:24px 0 20px;
  display:grid;
  grid-template-rows:auto 1fr auto;
  gap:22px;
}
header{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:start;
}
h1{font:inherit;font-weight:400;margin:0}
nav{display:flex;gap:18px}
.stage{
  min-height:0;
  display:grid;
  grid-template-columns:210px 1fr;
  gap:34px;
  align-items:stretch;
}
.side{
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:2px 0 1px;
}
.statement{margin:0;max-width:165px}
.statement span{display:block;color:var(--quiet);font-size:13px;margin-bottom:7px}
.note{margin:0;color:var(--quiet);font-size:13px;max-width:150px}
.gallery{
  min-width:0;
  min-height:0;
  display:grid;
  grid-template-columns:1.05fr .95fr;
  grid-template-rows:1fr 1fr;
  gap:14px;
}
figure{
  min-width:0;
  min-height:0;
  margin:0;
  display:grid;
  grid-template-rows:1fr auto;
  gap:6px;
}
.image{
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.image img{
  display:block;
  max-width:100%;
  max-height:100%;
  width:auto;
  height:auto;
  object-fit:contain;
}
figure:nth-child(1){grid-row:1 / span 2}
figure:nth-child(1) .image{justify-content:flex-start}
figure:nth-child(2) .image,
figure:nth-child(3) .image{justify-content:flex-end}
figcaption{
  color:var(--quiet);
  font-size:12px;
  display:flex;
  justify-content:space-between;
  gap:12px;
}
figcaption span:last-child{text-align:right}
footer{
  display:grid;
  grid-template-columns:210px 1fr auto;
  gap:34px;
  padding-top:9px;
  border-top:1px solid var(--rule);
  color:var(--quiet);
  font-size:12px;
}
@media(max-width:760px){
  .page{
    height:auto;
    min-height:100svh;
    width:calc(100% - 28px);
    padding-top:18px;
    display:block;
  }
  header{margin-bottom:12vh}
  .stage{display:block}
  .side{margin-bottom:10vh}
  .statement{max-width:230px}
  .note{display:none}
  .gallery{
    display:flex;
    flex-direction:column;
    gap:12vh;
  }
  figure:nth-child(1){order:0}
  figure .image{display:block}
  .image img{width:100%;height:auto;max-height:none}
  figcaption{margin-top:7px}
  footer{
    margin-top:14vh;
    grid-template-columns:1fr auto;
    gap:14px;
    padding-bottom:20px;
  }
  footer .place{display:none}
}
</style>
</head>
<body>
<main class="page">
<header>
<h1>Cole Calfee</h1>
<nav>
<a href="mailto:hello@colecalfee.com">Contact</a>
<a href="https://instagram.com/colecalfee" target="_blank" rel="noopener">Instagram</a>
</nav>
</header>

<section class="stage">
<aside class="side">
<p class="statement"><span>Practice</span>Photography, design, and artwork.</p>
<p class="note">Selected work, ongoing.</p>
</aside>

<section class="gallery" aria-label="Selected work">
<figure>
<div class="image"><img src="/assets/kashus-after.webp" alt="Single artwork for Kashus Culpepper"></div>
<figcaption><span>Kashus Culpepper</span><span>Single artwork</span></figcaption>
</figure>

<figure>
<div class="image"><img src="/assets/scout.webp" alt="Illustrated work for Scout Motors"></div>
<figcaption><span>Scout Motors</span><span>Illustration</span></figcaption>
</figure>

<figure>
<div class="image"><img src="/assets/cowboyer.webp" alt="The Cowboyer cover studies"></div>
<figcaption><span>The Cowboyer</span><span>Cover studies</span></figcaption>
</figure>
</section>
</section>

<footer>
<span class="place">Nashville, Tennessee</span>
<a href="mailto:hello@colecalfee.com">hello@colecalfee.com</a>
<span>© 2026</span>
</footer>
</main>
</body>
</html>
