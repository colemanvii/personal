<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Cole Calfee</title>
<meta name="description" content="Cole Calfee — selected creative work.">
<link rel="canonical" href="https://colecalfee.com/">
<link rel="stylesheet" href="/assets/css/site.css?v=10">
<script src="/assets/js/site.js?v=8"></script>
<style>
/* Freeman V5 landing geometry: source-matched values. */
body.landing{font-family:Monaco,"Courier New",monospace}
body.landing .landing-frame{min-height:100dvh;position:relative;display:block;padding:0}
body.landing .seven{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:baseline;justify-content:center;gap:13px;flex-wrap:nowrap;width:auto;max-width:none;white-space:nowrap;font:400 14px/1 Monaco,"Courier New",monospace;letter-spacing:-.025em;text-align:left}
body.landing .seven > *{display:inline-block;flex:none}
body.landing .seven > * + *::before{content:none;display:none}
body.landing .seven .name{font-weight:700;color:var(--ink)}
body.landing .seven .slash{color:var(--muted);font-weight:400}
body.landing .seven a{color:var(--ink);text-decoration:none}
body.landing .seven a:last-child{color:var(--accent)}
body.landing .seven a:hover,body.landing .seven a:focus-visible{color:var(--accent);text-decoration:underline;text-underline-offset:4px}
body.landing .landing-ident{position:absolute;left:30px;bottom:24px;font:400 8px/1.35 Monaco,"Courier New",monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
body.landing .landing-paper{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;align-items:center;gap:2px}
body.landing .landing-paper button{width:44px;height:44px;min-height:44px}
body.landing .landing-paper button::after{width:18px;height:18px;left:13px;top:13px}
@media(max-width:720px){
body.landing .seven{width:calc(100vw - 36px);max-width:calc(100vw - 36px);flex-wrap:wrap;row-gap:10px;column-gap:13px;font-size:12px;line-height:1}
body.landing .landing-ident{left:16px;bottom:16px;font-size:7px}
body.landing .landing-paper{bottom:12px}
}

/* Freeman-style full-word highlight, using Cole's selected palette. */
html body.landing .seven a:hover,
html body.landing .seven a:focus-visible,
html[data-tone] body.landing .seven a:hover,
html[data-tone] body.landing .seven a:focus-visible{
  color:var(--paper)!important;
  background:var(--accent)!important;
  box-shadow:0 0 0 3px var(--accent);
  text-decoration:none!important;
  outline:none;
}

/* Preserve the site's custom target cursor across the color-switcher hit area. */
body.landing .landing-paper{cursor:inherit!important}
body.landing .landing-paper button,
body.landing .landing-paper button:hover,
body.landing .landing-paper button:focus-visible{cursor:inherit!important}

/* Freeman landing screenshot parity: visual system, not the copy. */
body.landing{background:var(--paper);color:var(--ink)}
body.landing .seven{font-size:16px;gap:13px;font-weight:400;letter-spacing:-.025em}
body.landing .seven .name{font-weight:400;color:var(--accent)}
body.landing .seven a:last-child{color:var(--ink)}
body.landing .seven .slash{color:var(--muted)}
body.landing .seven a:hover,body.landing .seven a:focus-visible{color:var(--accent)}
body.landing .landing-ident{font-size:10px;line-height:1.4;left:28px;bottom:27px;letter-spacing:.025em}
body.landing .landing-paper{bottom:21px;gap:0}
body.landing .landing-paper button{width:28px;height:32px;min-height:32px;padding:0;outline:0!important}
body.landing .landing-paper button::after{width:18px;height:18px;left:5px;top:7px;border:1px solid var(--muted)}
body.landing .landing-paper button[aria-pressed="true"]::after{outline:0;border:1px solid var(--ink)}
body.landing .landing-paper button:focus-visible::after{outline:1px solid var(--ink);outline-offset:2px}
@media(max-width:720px){
body.landing .seven{font-size:12px;gap:10px;row-gap:10px}
body.landing .landing-ident{font-size:8px;left:16px;bottom:16px}
body.landing .landing-paper{bottom:13px}
}

/* Mobile composition: deliberate two-line masthead and compact palette controls.
   Desktop geometry and all palette values remain untouched. */
@media(max-width:720px){
 body.landing .landing-frame{height:100dvh;min-height:100dvh;overflow:hidden}
 body.landing .seven{
  top:46%;width:calc(100% - 36px);max-width:440px;
  display:grid;grid-template-columns:1fr;justify-items:center;align-items:center;
  gap:0 13px;row-gap:20px;line-height:1.2;font-size:16px;
  letter-spacing:-.025em;text-align:center;white-space:nowrap
 }
 body.landing .seven .name{
  flex:0 0 100%;text-align:center;font-size:inherit;
  letter-spacing:inherit
 }
 body.landing .seven a{font-size:inherit}
 body.landing .seven .slash{font-size:inherit}
 /* Stack navigation links individually on narrow screens. */
 body.landing .seven a{flex:0 0 100%;text-align:center}
 body.landing .seven .slash{display:none}
 body.landing .landing-paper{
  bottom:clamp(72px,11dvh,108px);gap:1px;
 }
 body.landing .landing-paper button{
  width:36px;height:44px;min-height:44px;
 }
 body.landing .landing-paper button::after{
  width:17px;height:17px;left:9.5px;top:13.5px;
 }
 body.landing .landing-ident{
  left:20px;bottom:22px;font-size:9px;
  line-height:1.45;letter-spacing:.06em;
 }
}
/* Keep the mobile entrance on the same fallback stack as the index. */
@media(max-width:720px){
 body.landing,body.landing .seven,body.landing .landing-ident{font-family:var(--mono)}
 /* Expand through existing whitespace; the 39.2px row pitch limits height. */
 body.landing .seven a{position:relative}
 body.landing .seven a::after{content:"";position:absolute;top:-9px;bottom:-9px;left:50%;width:min(440px,calc(100vw - 36px));transform:translateX(-50%)}
}

/* Typography, 2026-10-25. The name and the three destinations are set in
   Helvetica Neue, mixed case; composition, spacing and colour are unchanged.
   The corner ident stays in monospace, as metadata. */
html body.landing .seven{font-family:var(--sans);font-size:17px;font-weight:400;letter-spacing:-.012em;text-transform:none}
html body.landing .seven :is(.name,a,.slash){font-family:inherit;letter-spacing:inherit}
html body.landing .landing-ident{font-family:var(--mono);text-transform:uppercase}
@media(min-width:721px){
 /* Mixed case closes the space after the name; restore what mono gave it. */
 html body.landing .seven .name{margin-right:.35em}
}
@media(max-width:720px){
 html body.landing .seven{font-size:18px;row-gap:20px}
}

/* Colour chooser: permanent bordered 18px squares; never an outer selection box. */
html body.landing .landing-paper button[data-paper-tone]{
  appearance:none;-webkit-appearance:none;border:0!important;outline:0!important;
  box-shadow:none!important;background:transparent!important;
  position:relative;touch-action:manipulation;cursor:inherit;
}
html body.landing .landing-paper button[data-paper-tone]::after,
html body.landing .landing-paper button[data-paper-tone][aria-pressed="true"]::after{
  content:""!important;display:block!important;position:absolute!important;
  width:18px!important;height:18px!important;left:50%!important;top:50%!important;
  transform:translate(-50%,-50%)!important;
  border:1px solid #777!important;outline:0!important;box-shadow:none!important;
  box-sizing:border-box!important;
}
html body.landing .landing-paper button[data-paper-tone="off-white"]::after{background:#fff!important}
html body.landing .landing-paper button[data-paper-tone="graphite"]::after{background:#242628!important}
</style>
</head>
<body class="landing">
<main class="landing-frame" aria-label="Cole Calfee">
  <nav class="seven" aria-label="Primary">
    <span class="name">Cole Calfee</span>
    <a href="/index/">Index</a>
    <span class="slash" aria-hidden="true">/</span>
    <a href="/paintings/">Available</a>
    <span class="slash" aria-hidden="true">/</span>
    <a href="/info/">About</a>
  </nav>
</main>
<div class="paper-control landing-paper" role="group" aria-label="Site colour"><button type="button" data-paper-tone="off-white" aria-label="Cyber White" aria-pressed="true"></button><button type="button" data-paper-tone="graphite" aria-label="Graphite" aria-pressed="false"></button></div>
</body>
</html>
