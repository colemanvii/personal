<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cole Calfee</title>
<meta name="description" content="Cole Calfee — photography, design, and artwork.">
<style>
:root{
  --paper:#f5f3ed;
  --ink:#171715;
  --quiet:#77736b;
  --rule:#cbc7bd;
}
*{box-sizing:border-box}
html{background:var(--paper);color:var(--ink)}
body{
  margin:0;
  font-family:"Iowan Old Style",Baskerville,"Times New Roman",serif;
  font-size:15px;
  line-height:1.35;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
main{width:min(1080px,calc(100% - 56px));margin:auto;padding:26px 0 52px}
header{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:start;
  gap:32px;
  margin-bottom:17vh;
}
h1{font:inherit;margin:0;font-weight:400}
nav{display:flex;gap:20px}
.intro{
  display:grid;
  grid-template-columns:150px minmax(0,560px);
  gap:40px;
  margin-bottom:19vh;
}
.intro-label{margin:0;color:var(--quiet);font-size:13px}
.intro-copy{margin:0;max-width:470px;font-size:16px}
.work{display:flex;flex-direction:column;gap:20vh}
.plate{
  display:grid;
  grid-template-columns:150px minmax(0,1fr);
  gap:40px;
  margin:0;
  align-items:start;
}
.meta{
  color:var(--quiet);
  font-size:13px;
  padding-top:1px;
}
.meta p{margin:0}
.meta p+p{margin-top:2px}
.image-wrap{width:100%}
.image-wrap img{display:block;width:100%;height:auto}
.plate.narrow .image-wrap{width:64%}
.plate.narrow.right .image-wrap{margin-left:auto}
.plate.medium .image-wrap{width:82%}
.plate.medium.right .image-wrap{margin-left:auto}
.plate.full .image-wrap{width:100%}
footer{
  display:grid;
  grid-template-columns:150px 1fr auto;
  gap:40px;
  border-top:1px solid var(--rule);
  padding-top:10px;
  margin-top:20vh;
  color:var(--quiet);
  font-size:13px;
}
@media(max-width:720px){
  main{width:calc(100% - 28px);padding-top:18px}
  header{margin-bottom:12vh}
  nav{gap:14px}
  .intro{
    grid-template-columns:1fr;
    gap:10px;
    margin-bottom:13vh;
  }
  .work{gap:14vh}
  .plate{
    grid-template-columns:1fr;
    gap:10px;
  }
  .meta{order:2}
  .image-wrap{order:1}
  .plate.narrow .image-wrap,
  .plate.medium .image-wrap{width:100%;margin:0}
  footer{
    grid-template-columns:1fr auto;
    gap:8px 20px;
    margin-top:14vh;
  }
  footer .place{display:none}
}
</style>
</head>
<body>
<main>
<header>
<h1>Cole Calfee</h1>
<nav>
<a href="mailto:hello@colecalfee.com">Contact</a>
<a href="https://instagram.com/colecalfee" target="_blank" rel="noopener">Instagram</a>
</nav>
</header>

<section class="intro" aria-label="Introduction">
<p class="intro-label">Practice</p>
<p class="intro-copy">Photography, design, and artwork.</p>
</section>

<section class="work" aria-label="Work">

<figure class="plate narrow">
<figcaption class="meta">
<p>Kashus Culpepper</p>
<p>Single artwork</p>
</figcaption>
<div class="image-wrap">
<img src="/assets/kashus-after.webp" alt="Single artwork for Kashus Culpepper">
</div>
</figure>

<figure class="plate medium right">
<figcaption class="meta">
<p>Scout Motors</p>
<p>Illustration and design</p>
</figcaption>
<div class="image-wrap">
<img src="/assets/scout.webp" alt="Illustrated work for Scout Motors">
</div>
</figure>

<figure class="plate narrow right">
<figcaption class="meta">
<p>Kashus Culpepper</p>
<p>Character illustration</p>
</figcaption>
<div class="image-wrap">
<img src="/assets/kashus-character.webp" alt="Character illustration for Kashus Culpepper">
</div>
</figure>

<figure class="plate full">
<figcaption class="meta">
<p>The Cowboyer</p>
<p>Cover studies</p>
</figcaption>
<div class="image-wrap">
<img src="/assets/cowboyer.webp" alt="Four fictional magazine covers titled The Cowboyer">
</div>
</figure>

</section>

<footer>
<span class="place">Nashville, Tennessee</span>
<a href="mailto:hello@colecalfee.com">hello@colecalfee.com</a>
<span>© 2026</span>
</footer>
</main>
</body>
</html>
