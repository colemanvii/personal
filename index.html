<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cole Calfee</title>
<meta name="description" content="Cole Calfee — photography, design, and artwork.">
<style>
:root{
  --paper:#f5f3ed;
  --ink:#171715;
  --quiet:#77736b;
  --rule:#cbc7bd;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{
  font-family:"Iowan Old Style",Baskerville,"Times New Roman",serif;
  font-size:15px;
  line-height:1.35;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
main{
  width:min(780px,calc(100% - 40px));
  margin:0 auto;
  padding:28px 0 46px;
}
header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:24px;
  margin-bottom:15vh;
}
h1{font:inherit;font-weight:400;margin:0}
nav{display:flex;gap:18px}
.work{display:flex;flex-direction:column;gap:16vh}
figure{margin:0}
figure img{
  display:block;
  width:100%;
  height:auto;
}
figure.small{width:78%;margin:0 auto}
figcaption{
  margin-top:8px;
  color:var(--quiet);
  font-size:13px;
}
footer{
  margin-top:16vh;
  padding-top:10px;
  border-top:1px solid var(--rule);
  display:flex;
  justify-content:space-between;
  gap:24px;
  color:var(--quiet);
  font-size:13px;
}
@media(max-width:560px){
  main{width:calc(100% - 28px);padding-top:18px}
  header{margin-bottom:11vh}
  nav{gap:14px}
  .work{gap:12vh}
  figure.small{width:100%}
  footer{margin-top:12vh}
}
</style>
</head>
<body>
<main>
<header>
<h1>Cole Calfee</h1>
<nav>
<a href="mailto:hello@colecalfee.com">Contact</a>
<a href="https://instagram.com/colecalfee" target="_blank" rel="noopener">Instagram</a>
</nav>
</header>

<section class="work" aria-label="Work">
<figure>
<img src="/assets/kashus-after.webp" alt="Single artwork for Kashus Culpepper">
<figcaption>Kashus Culpepper / Single artwork</figcaption>
</figure>

<figure class="small">
<img src="/assets/scout.webp" alt="Illustrated work for Scout Motors">
<figcaption>Scout Motors / Illustration</figcaption>
</figure>

<figure>
<img src="/assets/cowboyer.webp" alt="The Cowboyer cover studies">
<figcaption>The Cowboyer / Cover studies</figcaption>
</figure>
</section>

<footer>
<a href="mailto:hello@colecalfee.com">hello@colecalfee.com</a>
<span>© 2026</span>
</footer>
</main>
</body>
</html>
