<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cole Calfee</title>
<meta name="description" content="Cole Calfee — selected work.">
<style>
*{box-sizing:border-box}
html{background:#f5f3ed;color:#171715}
body{margin:0;font-family:"Iowan Old Style",Baskerville,"Times New Roman",serif;font-size:15px;line-height:1.35}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline}
main{width:min(760px,calc(100% - 40px));margin:auto;padding:28px 0 56px}
header{display:flex;justify-content:space-between;gap:24px;margin-bottom:18vh}
h1{font:inherit;margin:0}
nav{display:flex;gap:18px}
.work{min-height:48vh}
.work-label{margin:0 0 32px;color:#77736b}
.note{max-width:360px;margin:0;color:#77736b}
footer{display:flex;justify-content:space-between;gap:24px;border-top:1px solid #cbc7bd;padding-top:10px;margin-top:14vh}
@media(max-width:560px){main{width:calc(100% - 28px);padding-top:18px}header{margin-bottom:14vh}}
</style>
</head>
<body>
<main>
<header>
<h1>Cole Calfee</h1>
<nav>
<a href="mailto:hello@colecalfee.com">Contact</a>
<a href="https://instagram.com/colecalfee" target="_blank" rel="noopener">Instagram</a>
</nav>
</header>

<section class="work" aria-labelledby="work-title">
<p class="work-label" id="work-title">Selected work</p>
<p class="note">Past work, honestly presented. Painting, drawing, design, photography, and other things made along the way.</p>
</section>

<footer>
<span>Cole Calfee</span>
<span>© 2026</span>
</footer>
</main>
</body>
</html>
