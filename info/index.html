<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>About — Cole Calfee</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="canonical" href="https://colecalfee.com/info/">
<meta name="description" content="Cole Calfee — Nashville, Tennessee / North Georgia.">
<style>
:root{--paper:#fff;--ink:#111;--muted:#626262;--rule:#d9d9d9;--accent:#a43f33;--sans:"Helvetica Neue",Helvetica,Arial,sans-serif;--mono:Monaco,Menlo,"SFMono-Regular",Consolas,monospace}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
a:hover{color:var(--accent)}
.shell{width:min(1440px,calc(100% - 76px));margin:0 auto;min-height:100svh;display:flex;flex-direction:column}
.site-head{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:35px 0 28px;border-bottom:1px solid var(--rule)}
.brand{font-size:16px;line-height:1;letter-spacing:-.02em}
.nav{display:flex;gap:25px;align-items:center;font-size:15px;line-height:1;letter-spacing:-.025em;white-space:nowrap}
.nav a{padding-bottom:5px}
.nav a[aria-current="page"]{color:var(--accent);border-bottom:1px solid currentColor}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:30px 0 32px}
.spread{width:min(1050px,100%);margin:auto}
.image-plate{margin:0;overflow:hidden;background:#e9e7e2}
.image-plate img{width:100%;height:auto;aspect-ratio:1.80;object-fit:cover;object-position:center 2%;display:block}
.under{display:flex;justify-content:space-between;align-items:flex-start;gap:48px;padding-top:23px}
.identity h1{margin:0;font:400 24px/1.13 var(--sans);letter-spacing:-.033em}
.location{margin:9px 0 0;color:var(--muted);font:400 10px/1.4 var(--mono);letter-spacing:.04em;text-transform:uppercase}
.contact{display:flex;align-items:flex-start;gap:62px;padding-top:4px}
.contact .group{display:flex;flex-direction:column;gap:8px}
.contact .eyebrow{font:400 10px/1.4 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.contact a{font:400 15px/1.3 var(--sans);letter-spacing:-.02em;border-bottom:1px solid var(--rule);padding-bottom:3px;white-space:nowrap}
.contact a svg.external-arrow{display:inline-block;width:14px;height:14px;margin-left:4px;vertical-align:-2px;flex:none}
.footer{border-top:1px solid var(--rule);padding:17px 0 24px;color:var(--muted);font:400 11px/1.4 var(--mono);letter-spacing:.04em;text-transform:uppercase}
@media(max-width:700px){
 .shell{width:calc(100% - 40px)}
 .site-head{padding:23px 0 19px;gap:10px}
 .brand{font-size:14px}
 .nav{gap:16px;font-size:13px}
 .nav a{padding-bottom:4px}
 main{display:block;padding:32px 0 38px}
 .spread{width:100%}
 .image-plate img{aspect-ratio: .79;object-position:12% center}
 .under{display:block;padding-top:23px}
 .identity h1{font-size:23px}
 .location{margin-top:8px;font-size:9px;line-height:1.6}
 .contact{margin-top:25px;padding-top:16px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:15px}
 .contact .group{gap:9px}
 .contact .eyebrow{font-size:9px}
 .contact a{font-size:13px}
 .contact a svg.external-arrow{width:12px;height:12px;margin-left:2px}
 .footer{padding:13px 0 17px;font-size:10px}
}
@media(max-width:359px){
 .shell{width:calc(100% - 32px)}
 .nav{font-size:12px;gap:11px}
 .image-plate img{aspect-ratio:.88}
 .contact{gap:10px}
 .contact a{font-size:12px}
}
@media(min-width:701px) and (max-height:780px){
 main{padding:25px 0}
 .spread{width:min(900px,100%)}
 .image-plate img{aspect-ratio:1.85}
 .under{padding-top:14px}
}

/* Single-screen About composition: image and contact remain within the viewport. */
html,body{height:100%;overflow:hidden}
.shell{height:100svh;min-height:0}
.site-head,.footer{flex-shrink:0}
main{flex:1;min-height:0;overflow:hidden}
.spread{display:flex;flex-direction:column;justify-content:center;min-height:0;height:100%;max-height:670px;margin:auto}
.image-plate{aspect-ratio:1.8;flex:0 1 auto;min-height:0}
.image-plate img{width:100%;height:100%;aspect-ratio:auto;object-fit:cover}
.under{flex-shrink:0}
@media(max-width:700px){
 main{display:flex;align-items:center;justify-content:center;padding:clamp(10px,3svh,32px) 0 clamp(8px,3svh,38px)}
 .spread{height:100%;max-height:660px}
 .image-plate{aspect-ratio:.79;flex:0 1 auto;min-height:0}
 .image-plate img{aspect-ratio:auto;object-position:12% center}
}
@media(max-width:359px){
 .image-plate{aspect-ratio:.88}
}
@media(max-height:670px){
 main{padding-top:10px;padding-bottom:10px}
 .under{padding-top:12px}
 .contact{margin-top:12px;padding-top:10px}
 .footer{padding-top:9px;padding-bottom:10px}
}
@media(max-height:560px){
 .site-head{padding-top:10px;padding-bottom:10px}
 .under{padding-top:7px}
 .contact{margin-top:8px;padding-top:8px}
 .contact .group{gap:4px}
 .location{margin-top:4px}
}
</style>
<style>html[data-tone="graphite"]{--paper:#242628;--ink:#f1f1ef;--muted:#b7babc;--rule:#505457;--accent:#f1f1ef}html[data-tone="graphite"] body{background:var(--paper);color:var(--ink)}</style><script src="/assets/js/site.js?v=5"></script></head>
<body>
<div class="shell">
  <header class="site-head">
    <a class="brand" href="/">Cole Calfee</a>
    <nav class="nav" aria-label="Primary navigation">
      <a href="/index/">Index</a>
      <a href="/paintings/">Available</a>
      <a href="/info/" aria-current="page">About</a>
    </nav>
  </header>
  <main id="about">
    <div class="spread">
      <figure class="image-plate"><img alt="A motion-blurred figure walking past colorful paintings on a studio wall." src="/assets/images/about-studio-motion.jpg" width="1500" height="1000" decoding="async" fetchpriority="high"></figure>
      <section class="under" aria-label="About and contact">
        <div class="identity">
          <h1>Cole Calfee</h1>
          <p class="location">Nashville, Tennessee / North Georgia</p>
        </div>
        <div class="contact">
          <div class="group"><span class="eyebrow">Email</span><a href="mailto:colecalfee@gmail.com">colecalfee@gmail.com <svg class="external-arrow" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M3.5 12.5 12.5 3.5 M5 3.5h7.5V11" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="square" stroke-linejoin="miter"/></svg></a></div>
          <div class="group"><span class="eyebrow">Instagram</span><a href="https://www.instagram.com/colecalfee/" target="_blank" rel="noopener noreferrer">@colecalfee <svg class="external-arrow" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M3.5 12.5 12.5 3.5 M5 3.5h7.5V11" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="square" stroke-linejoin="miter"/></svg></a></div>
        </div>
      </section>
    </div>
  </main>
  <footer class="footer">© 2026 Cole Calfee</footer>
</div>
</body>
</html>
