<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>About — Cole Calfee</title>
<meta name="description" content="Cole Calfee. Somewhere between art and work. Nashville, Tennessee / North Georgia.">
<link rel="canonical" href="https://colecalfee.com/info/">
<script>try{const t=sessionStorage.getItem('cole-paper-tone-session-v3');document.documentElement.dataset.tone=['off-white','field-notes','violet-hour','red-earth'].includes(t)?t:'off-white';}catch(e){document.documentElement.dataset.tone='off-white';}</script>
<link rel="stylesheet" href="/assets/css/site.css">
<style>
/* Header and footer as on Paintings. */
.about .site-head .brand,.about .site-head .nav{font-family:var(--sans);text-transform:none;letter-spacing:-.02em}
.about .site-head .nav{display:flex;gap:20px}
.about .site-head a[aria-current]{color:var(--accent);border-bottom:1px solid currentColor}
/* An arrow is always type, never an emoji. */
.about .ext{font-family:var(--sans);font-variant-emoji:text;font-weight:400}
.about main{flex:1}
.about a.line{border-bottom:1px solid var(--rule);padding-bottom:2px;transition:color .15s,border-color .15s}
.about a.line:hover{color:var(--accent);border-color:currentColor}
.about a.line:focus-visible{outline:1px solid var(--accent);outline-offset:4px}
.about .label{font:11px/1.45 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
@media(max-width:700px){
  .about .site-head{grid-template-columns:auto minmax(0,1fr);align-items:baseline;column-gap:16px;padding:16px 0 12px}
  .about .site-head .brand,.about .site-head .nav{font-size:13px}
  .about .site-head .nav{justify-content:flex-end;flex-wrap:nowrap;gap:13px;white-space:nowrap}
  .about .site-head a[aria-current]{border-bottom:0}
}

/* Ruled fields in the gallery's type; the message box, faintly tinted, starts at three lines and grows. */
.about main{flex:1}
.note label{display:block}
.note .field{display:block;width:100%;margin:6px 0 0;padding:6px 0 8px;border:0;border-bottom:1px solid var(--rule);border-radius:0;background:transparent;color:var(--ink);font:400 16px/1.5 var(--sans);letter-spacing:-.01em;outline:0;-webkit-appearance:none;appearance:none;transition:border-color .15s}
.note .field::placeholder{color:var(--muted);opacity:.7}
.note .field:focus{border-bottom-color:var(--ink)}
.note textarea.field{min-height:calc(3 * 1.5em + 20px);max-height:60vh;resize:none;overflow-y:auto;field-sizing:content;margin-top:8px;padding:10px 12px;background:color-mix(in srgb,var(--ink) 3%,var(--paper))}
.note textarea.field:focus{background:color-mix(in srgb,var(--ink) 4.5%,var(--paper))}
.note .row-message{margin-top:22px}
.note-send{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:14px;min-height:44px}
.note-status{margin:0;font:11px/1.5 var(--mono);letter-spacing:.03em;color:var(--muted)}
.note-status[data-state="sent"]{color:var(--ink)}
.note-status[data-state="error"]{color:var(--accent)}
.note-send button{flex:none;appearance:none;-webkit-appearance:none;border:0;border-radius:0;background:none;padding:12px 0;margin:-12px 0;color:var(--ink);font:400 15px/1 var(--sans);letter-spacing:-.01em;cursor:inherit;touch-action:manipulation;white-space:nowrap}
.note-send button::after{content:" \2192"}
.note-send button:hover{color:var(--accent)}
.note-send button:focus-visible{outline:1px solid var(--accent);outline-offset:4px}
.note-send button:disabled{color:var(--muted)}
.note-send button:disabled::after{content:""}
.note .honey{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
.about p{margin:0}
.t15{font:400 15px/1.4 var(--sans);letter-spacing:-.015em}
/* Desktop: the composition sits in the middle of the screen; iPhone: it starts just under the header. */
@media(min-width:701px){.about main{display:flex;flex-direction:column;justify-content:center;padding:56px 0 72px}}
/* Letter. One narrow column in the middle of the page, set as the head of a letter: who, top left;
   the return address (where, email, Instagram), flush right opposite; the note below as its body. */
.letter{width:min(100%,600px);margin:0 auto}
.letterhead{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:40px;align-items:start;padding-bottom:22px;border-bottom:1px solid var(--rule)}
.letterhead h1{margin:0;font:400 19px/1.25 var(--sans);letter-spacing:-.022em}
.letterhead .who p{margin-top:6px;color:var(--muted)}
.return{text-align:right;display:grid;gap:3px;justify-items:end}
.return .label{margin-bottom:4px}
.letter .note{margin-top:26px}
@media(max-width:700px){
  .about main{padding:30px 0 56px}
  .letterhead{grid-template-columns:minmax(0,5fr) minmax(0,6fr);column-gap:16px;padding-bottom:20px}
  .letterhead h1{font-size:17px}
  .letterhead .who p{margin-top:4px}
  .return .label{margin-bottom:2px}
}
</style>
</head><body class="about"><div class="shell">
<header class="site-head">
  <div><a class="brand" href="/">Cole Calfee</a></div>
  <nav class="nav" aria-label="Primary"><a href="/index/">Index</a><a href="/paintings/">Paintings</a><a aria-current="page" href="/info/">About</a></nav>
</header>
<main><div class="letter">
  <header class="letterhead">
    <div class="who"><h1>Cole Calfee</h1><p class="t15">Somewhere between art and work.</p></div>
    <address class="return t15" style="font-style:normal"><span class="label">Nashville, Tennessee / North Georgia</span><span><a class="line" href="mailto:colecalfee@gmail.com">colecalfee@gmail.com</a> <span class="ext" aria-hidden="true">&#x2197;&#xFE0E;</span></span><span><a class="line" href="https://www.instagram.com/colecalfee/" target="_blank" rel="noopener noreferrer">@colecalfee</a> <span class="ext" aria-hidden="true">&#x2197;&#xFE0E;</span></span></address>
  </header>
  <form class="note " id="note" action="/api/contact" method="post" novalidate>
    <div class="row-email"><label class="label" for="note-email">Your email</label>
    <input class="field" id="note-email" name="email" type="email" autocomplete="email" inputmode="email" required maxlength="254" spellcheck="false"></div>
    <div class="row-message"><label class="label" for="note-message">Message</label>
    <textarea class="field" id="note-message" name="message" rows="3" required minlength="3" maxlength="5000" placeholder="Write a message"></textarea></div>
    <div class="honey" aria-hidden="true"><label for="note-website">Leave this empty</label><input id="note-website" name="website" type="text" tabindex="-1" autocomplete="off"></div>
    <div class="note-send">
      <p class="note-status" id="note-status" role="status" aria-live="polite"></p>
      <button type="submit">Send message</button>
    </div>
  </form>
</div></main>
<footer class="footer"><span>© 2026 Cole Calfee</span></footer>
</div><script src="/assets/js/site.js"></script>
<script>
/* The note posts to /api/contact (functions/api/contact.js). Success is shown
   only when the server answers {ok: true}; anything else says what went wrong. */
(function(){
  var form=document.getElementById('note'), status=document.getElementById('note-status'), button=form.querySelector('button');
  var opened=Date.now(), area=form.elements.message;
  function grow(){area.style.height='auto';area.style.height=area.scrollHeight+1+'px';}
  area.addEventListener('input',grow);form.addEventListener('reset',function(){setTimeout(grow);});
  function say(text,state){status.textContent=text;if(state)status.dataset.state=state;else delete status.dataset.state;}
  form.addEventListener('submit',async function(event){
    event.preventDefault();
    var email=form.elements.email, message=form.elements.message;
    if(!email.value.trim()||!email.checkValidity()){say('Please enter your email address.','error');email.focus();return;}
    if(message.value.trim().length<3){say('Please write a few words first.','error');message.focus();return;}
    button.disabled=true;button.textContent='Sending';say('Sending your note…');
    try{
      var response=await fetch('/api/contact',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email:email.value.trim(),message:message.value.trim(),website:form.elements.website.value,elapsed:Date.now()-opened})});
      var data=await response.json().catch(function(){return {};});
      if(response.ok&&data.ok===true){
        form.reset();opened=Date.now();
        say('Sent. Thank you for writing.','sent');button.textContent='Send another';
      }else{
        say(data.error||'Your note could not be sent. Please try again, or write to colecalfee@gmail.com.','error');button.textContent='Try again';
      }
    }catch(error){
      say('Your note could not be sent. Please check your connection and try again, or write to colecalfee@gmail.com.','error');button.textContent='Try again';
    }finally{button.disabled=false;}
  });
})();
</script></body></html>
