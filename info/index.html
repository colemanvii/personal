<script>try{const t=sessionStorage.getItem('cole-paper-tone-session-v3');document.documentElement.dataset.tone=['off-white','field-notes','red-earth'].includes(t)?t:'off-white';}catch(e){document.documentElement.dataset.tone='off-white';}</script>
<link rel="stylesheet" href="../assets/css/site.css">
<style>
html:has(body.about-page),body.about-page{height:100%;overflow:hidden;overscroll-behavior:none}
.about-page .shell{height:100dvh;min-height:0;overflow:hidden}
.about-page .site-head,.about-page .footer{flex-shrink:0}
.about-page .section{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:24px 0}
.about-page .about-content{width:min(100%,760px);margin:0 auto}
.about-page .about-name{margin:0 0 25px;font:400 clamp(27px,3vw,42px)/1.12 var(--mono);letter-spacing:-.055em;color:var(--ink)}
.about-page .about-description{margin:0;max-width:47ch;font:400 clamp(14px,1.45vw,18px)/1.55 var(--mono);letter-spacing:-.025em;color:var(--ink)}
.about-page .about-location{margin:24px 0 0;font:400 clamp(12px,1.1vw,15px)/1.5 var(--mono);color:var(--muted)}
.about-page .contact-links{margin-top:36px;display:flex;gap:28px;font:11px/1.4 var(--mono);text-transform:uppercase}
.about-page .contact-links a{text-decoration:none;border-bottom:1px solid var(--rule);padding-bottom:5px}
.about-page .contact-links a:focus-visible{color:var(--accent);background:var(--accent);box-shadow:0 0 0 3px var(--accent);color:var(--paper);border-color:transparent}
@media(hover:hover){.about-page .contact-links a:hover{color:var(--accent);background:var(--accent);box-shadow:0 0 0 3px var(--accent);color:var(--paper);border-color:transparent}}
@media(max-width:700px){
 .about-page .site-head{grid-template-columns:1fr auto}
 .about-page .section{padding:28px 0}
 .about-page .about-content{max-width:420px}
 .about-page .about-name{font-size:30px;margin-bottom:23px}
 .about-page .about-description{font-size:15px;line-height:1.55}
 .about-page .about-location{font-size:12px;margin-top:20px}
 .about-page .contact-links{margin-top:30px;gap:25px}
}
@media(max-width:380px){.about-page .about-name{font-size:27px}.about-page .about-description{font-size:14px}}

/* The contact instrument remains part of About, deliberately quiet and compact. */
.about-page .about-content{max-width:760px}
.about-page .about-name{margin-bottom:19px}
.about-page .contact-links{margin-top:22px}
.about-page .contact-card{margin-top:36px;max-width:760px}
.about-page .contact-label{display:block;margin-bottom:10px;font:11px/1.4 var(--mono);color:var(--muted);text-transform:uppercase}
.about-page .contact-email,.about-page .contact-message{display:block;width:100%;border:1px solid var(--rule);border-radius:0;background:#faf9f6;color:#332d38;font:12px/1.5 var(--mono);outline:none;appearance:none;-webkit-appearance:none}
.about-page .contact-email{height:43px;padding:10px 12px;margin-bottom:9px}
.about-page .contact-message{height:102px;padding:12px;resize:none}
.about-page .contact-email::placeholder,.about-page .contact-message::placeholder{color:#6e6a65;opacity:1}
.about-page .contact-email:focus-visible,.about-page .contact-message:focus-visible{outline:1px solid var(--accent);outline-offset:1px}
.about-page .contact-submit{display:flex;align-items:center;gap:20px;margin-top:12px}
.about-page .contact-submit button{appearance:none;border:0;border-bottom:1px solid var(--ink);border-radius:0;background:transparent;color:var(--ink);padding:0 0 5px;font:11px/1.4 var(--mono);cursor:inherit}
.about-page .contact-submit button:hover{color:var(--accent);border-color:var(--accent)}
.about-page .contact-note{margin:0;font:10px/1.4 var(--mono);color:var(--muted)}
.about-page .contact-honeypot{position:absolute;left:-9999px}
@media(max-width:700px){
 .about-page .about-content{max-width:420px}
 .about-page .contact-card{margin-top:24px}
 .about-page .contact-message{height:92px}
 .about-page .contact-links{margin-top:19px}
 .about-page .section{padding:14px 0}
}
@media(max-height:720px){
 html:has(body.about-page),body.about-page{height:auto;min-height:100%;overflow-y:auto}
 .about-page .shell{height:auto;min-height:100dvh;overflow:visible}
 .about-page .section{padding:22px 0}
}
@media(max-width:700px){
 html:has(body.about-page:has(.contact-card :focus)),body.about-page:has(.contact-card :focus){height:auto;min-height:100%;overflow-y:auto}
 .about-page:has(.contact-card :focus) .shell{height:auto;min-height:100dvh;overflow:visible}
}

/* ABOUT — first editorial study, October 2026. */
.about-page .about-content{width:min(100%,760px);max-width:760px}
.about-page .about-editorial{display:block;max-width:680px}
.about-page .about-intro{min-width:0}
.about-page .about-name{font-size:clamp(30px,3.3vw,46px);margin-bottom:20px}
.about-page .about-description{font-size:clamp(14px,1.3vw,17px);line-height:1.5;max-width:36ch}
.about-page .about-statement{font:12px/1.7 var(--mono);color:var(--muted);max-width:49ch;margin:22px 0 0}
.about-page .about-location{font-size:11px;margin-top:24px}
.about-page .contact-links{margin-top:20px}
.about-page .about-image{margin:0;min-width:0}
.about-page .about-image img{display:block;width:100%;height:clamp(215px,34vh,350px);object-fit:cover;filter:grayscale(100%)}
.about-page .about-image figcaption{margin-top:9px;font:9px/1.35 var(--mono);color:var(--muted);letter-spacing:.025em}
.about-page .contact-card{max-width:480px;margin-top:44px}
.about-page .contact-email{height:39px}
.about-page .contact-message{height:66px}
.about-page .section{padding:16px 0}
@media(max-width:700px){
 html:has(body.about-page),body.about-page{height:auto;min-height:100%;overflow-y:auto}
 .about-page .shell{height:auto;min-height:100dvh;overflow:visible}
 .about-page .about-content{max-width:440px}
 .about-page .about-editorial{grid-template-columns:1fr;gap:22px}
 .about-page .about-name{font-size:32px;margin-bottom:15px}
 .about-page .about-statement{font-size:11px;margin-top:15px}
 .about-page .about-location{margin-top:16px}
 .about-page .contact-links{margin-top:16px}
 .about-page .about-image img{height:180px}
 .about-page .contact-card{margin-top:22px}
 .about-page .section{padding:25px 0}
}
@media(max-height:780px) and (min-width:701px){
 .about-page .about-image img{height:220px}
 .about-page .about-statement{margin-top:14px}
 .about-page .contact-card{margin-top:18px}
 .about-page .contact-message{height:55px}
}

/* About follows the same Helvetica Neue typography as Work Index and Paintings. */
.about-page .about-name,.about-page .about-description,.about-page .about-location,
.about-page .contact-links{font-family:var(--sans)}
.about-page .about-name{letter-spacing:-.04em}
.about-page .about-description{letter-spacing:-.015em}

/* Typography release, 2026-10-25: the contact links read as words in Helvetica
   Neue; the place line is information, in monospace. 44px touch targets. */
.about-page .contact-links{font:14px/1.4 var(--sans);letter-spacing:-.01em;text-transform:none}
.about-page .contact-links a{position:relative}
.about-page .contact-links a::after{content:"";position:absolute;inset:-12px -6px}
.about-page .about-location{font:12px/1.5 var(--mono);letter-spacing:0}
.about-page .contact-submit button{position:relative}
.about-page .contact-submit button::after{content:"";position:absolute;inset:-12px -6px}
</style>
</head><body class="about-page"><div class="shell">
<header class="site-head">
  <div><a class="brand" aria-label="Cole Calfee" href="../">Cole Calfee</a></div>
  <nav class="nav" aria-label="Primary"><a href="/index/">Work Index</a><a href="/paintings/">Paintings</a><a aria-current="page" href="/info/">About</a></nav>
</header>
<main class="section">
  <div class="about-content">
    <div class="about-editorial">
      <div class="about-intro">
    <h1 class="about-name">Cole Calfee</h1>
    <p class="about-description">Somewhere between art and work.</p>
    <p class="about-location">Nashville, Tennessee / North Georgia</p>
    <nav class="contact-links" aria-label="Contact links">
      <a href="mailto:colecalfee@gmail.com">Email ↗</a>
      <a href="https://www.instagram.com/colecalfee/" target="_blank" rel="noopener noreferrer">Instagram ↗</a>
    </nav>
      </div>
    </div>
    <form class="contact-card" id="contact-form" action="/api/contact" method="post">
      <label class="contact-label" for="contact-email">GET IN TOUCH</label>
      <div class="contact-honeypot" aria-hidden="true"><label for="contact-website">Website</label><input id="contact-website" name="website" type="text" tabindex="-1" autocomplete="off"></div>
      <input class="contact-email" id="contact-email" type="email" name="email" autocomplete="email" placeholder="Your email address" aria-label="Your email address" required maxlength="254">
      <textarea class="contact-message" id="contact-message" name="message" placeholder="What’s on your mind?" aria-label="Your message" required maxlength="3000"></textarea>
      <div class="contact-submit">
        <button type="submit">SEND MESSAGE ↗</button>
        <p class="contact-note" id="contact-status" role="status" aria-live="polite"></p>
      </div>
    </form>
  </div>
</main>
<footer class="footer"><span>© 2026 Cole Calfee</span></footer>
</div><script src="../assets/js/site.js"></script>
<script>
(function(){
 const form=document.getElementById('contact-form');
 if(!form)return;
 const button=form.querySelector('button[type="submit"]');
 const status=document.getElementById('contact-status');
 form.addEventListener('submit',async function(event){
  event.preventDefault();
  if(!form.reportValidity())return;
  const message=form.elements.message.value.trim();
  if(message.length<3){status.textContent='Please write a little more.';return;}
  button.disabled=true;
  button.textContent='SENDING…';
  status.textContent='Sending your note…';
  try{
   const response=await fetch('/api/contact',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({message:message,email:form.elements.email.value.trim(),website:form.elements.website.value})
   });
   if(!response.ok)throw new Error('Send failed');
   form.elements.message.value='';
   form.elements.email.value='';
   status.textContent='MESSAGE SENT. THANK YOU.';
   button.textContent='SEND ANOTHER ↗';
  }catch(error){
   status.textContent='Could not send. Try again, or use the email link.';
   button.textContent='TRY AGAIN ↗';
  }finally{button.disabled=false;}
 });
})();
</script></body></html>
