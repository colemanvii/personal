<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>About — Cole Calfee</title>
<meta name="description" content="Cole Calfee. Somewhere between art and work. Nashville, Tennessee / North Georgia.">
<link rel="canonical" href="https://colecalfee.com/info/">
<script>try{const t=sessionStorage.getItem('cole-paper-tone-session-v3');document.documentElement.dataset.tone=['off-white','field-notes','violet-hour','red-earth'].includes(t)?t:'off-white';}catch(e){document.documentElement.dataset.tone='off-white';}</script>
<link rel="stylesheet" href="/assets/css/site.css">
<style>
/* Header and footer as on Paintings. */
.about .site-head .brand,.about .site-head .nav{font-family:var(--sans);text-transform:none;letter-spacing:-.02em}
.about .site-head .nav{display:flex;gap:20px}
.about .site-head a[aria-current]{color:var(--accent);border-bottom:1px solid currentColor}
/* An arrow is always type, never an emoji. */
.about .ext{font-family:var(--sans);font-variant-emoji:text;font-weight:400}
.about main{flex:1}
.about a.line{border-bottom:1px solid var(--rule);padding-bottom:2px;transition:color .15s,border-color .15s}
.about a.line:hover{color:var(--accent);border-color:currentColor}
.about a.line:focus-visible{outline:1px solid var(--accent);outline-offset:4px}
.about .label{font:11px/1.45 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
@media(max-width:700px){
  .about .site-head{grid-template-columns:auto minmax(0,1fr);align-items:baseline;column-gap:16px;padding:16px 0 12px}
  .about .site-head .brand,.about .site-head .nav{font-size:13px}
  .about .site-head .nav{justify-content:flex-end;flex-wrap:nowrap;gap:13px;white-space:nowrap}
  .about .site-head a[aria-current]{border-bottom:0}
}

/* A · Colophon. Set within the first column of the gallery's three: the statement, then the facts in a ruled list,
   a narrow column of labels beside their values. */
.about main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:clamp(28px,3.6vw,60px);align-content:start;padding:clamp(40px,5.5vw,84px) 0 96px}
.colophon-head{grid-column:1/3}
.colophon-head h1{margin:0;font:400 15px/1.3 var(--sans);letter-spacing:-.02em}
.colophon-head p{margin:14px 0 0;font:400 clamp(28px,2.9vw,42px)/1.1 var(--sans);letter-spacing:-.035em;max-width:15ch;text-wrap:balance}
.facts{grid-column:1;margin:clamp(44px,5vw,72px) 0 0;display:grid;grid-template-columns:110px minmax(0,1fr);border-top:1px solid var(--rule)}
.facts div{grid-column:1/-1;display:grid;grid-template-columns:subgrid;align-items:baseline;padding:13px 0 14px;border-bottom:1px solid var(--rule)}
.facts dt{grid-column:1}
.facts dd{grid-column:2;margin:0;font:400 15px/1.35 var(--sans);letter-spacing:-.015em;min-width:0;overflow-wrap:anywhere}
@media(max-width:700px){
  .about main{grid-template-columns:1fr;padding:30px 0 56px}
  .colophon-head,.facts{grid-column:1}
  .colophon-head h1{font-size:13px}
  .colophon-head p{margin-top:10px;font-size:27px;line-height:1.12}
  .facts{margin-top:36px;grid-template-columns:96px minmax(0,1fr)}
  .facts div{grid-column:1/-1;padding:12px 0 13px}
  .facts dd{font-size:15px}
}
</style>
</head><body class="about"><div class="shell">
<header class="site-head">
  <div><a class="brand" href="/">Cole Calfee</a></div>
  <nav class="nav" aria-label="Primary"><a href="/index/">Index</a><a href="/paintings/">Paintings</a><a aria-current="page" href="/info/">About</a></nav>
</header>
<main>
  <header class="colophon-head">
    <h1>Cole Calfee</h1>
    <p>Somewhere between art and work.</p>
  </header>
  <dl class="facts">
    <div><dt class="label">Based</dt><dd>Nashville, Tennessee / North Georgia</dd></div>
    <div><dt class="label">Email</dt><dd><a class="line" href="mailto:colecalfee@gmail.com">colecalfee@gmail.com</a> <span class="ext" aria-hidden="true">&#x2197;&#xFE0E;</span></dd></div>
    <div><dt class="label">Instagram</dt><dd><a class="line" href="https://www.instagram.com/colecalfee/" target="_blank" rel="noopener noreferrer">@colecalfee</a> <span class="ext" aria-hidden="true">&#x2197;&#xFE0E;</span></dd></div>
  </dl>
</main>
<footer class="footer"><span>© 2026 Cole Calfee</span></footer>
</div><script src="/assets/js/site.js"></script></body></html>
