<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>01 — The Artist's Index · Cole Calfee</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300..600&family=Geist:wght@300..600&display=swap">
<style>
/* 01 — THE ARTIST'S INDEX
   Layout: one viewport, two fields. Left: the catalogue (ledger / plates / years).
   Right: the plate — one work at a time, large, with its catalogue entry.
   Every work carries a number that encodes where it lives: project.work (011.04). */
:root{
  --paper:#ffffff;
  --ink:#0e0e0d;
  --mid:#6d6c68;
  --faint:#a9a8a3;
  --rule:#e6e5e1;
  --red:#a3352a;          /* the red of Cole's ink drawings, kept from the current site */
  --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --sans:"Geist","Helvetica Neue",Helvetica,Arial,sans-serif;
  --gut:clamp(16px,2.1vw,30px);
  --bar:52px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink)}
body{font:400 12px/1.35 var(--mono);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
:focus-visible{outline:1px solid var(--red);outline-offset:2px}
.app{height:100dvh;display:grid;grid-template-rows:var(--bar) auto minmax(0,1fr) 40px;padding:0 max(var(--gut),env(safe-area-inset-right)) 0 max(var(--gut),env(safe-area-inset-left))}

/* masthead: the existing site's line — name, then destinations */
.mast{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--ink);gap:16px}
.mast .name{font:500 15px/1 var(--sans);letter-spacing:-.02em}
.mast .name span{color:var(--red)}
.mast nav{display:flex;gap:clamp(12px,2vw,26px);font:400 13px/1 var(--sans);letter-spacing:-.01em}
.mast nav a[aria-current]{color:var(--red)}
.mast nav a:hover{color:var(--red)}

/* control line: disciplines (with counts) and the three views */
.ctl{display:flex;justify-content:space-between;align-items:stretch;border-bottom:1px solid var(--rule);gap:24px;min-width:0}
.filters{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;min-width:0}
.filters::-webkit-scrollbar{display:none}
.filters button,.views button{padding:12px 14px 11px 0;white-space:nowrap;color:var(--mid);text-transform:uppercase;font-size:10.5px;letter-spacing:.04em}
.filters button sup{font-size:8px;margin-left:3px;color:var(--faint);vertical-align:3px}
.filters button[aria-pressed=true],.views button[aria-pressed=true]{color:var(--ink)}
.filters button[aria-pressed=true]::before{content:"■ ";color:var(--red);font-size:7px;vertical-align:2px}
.filters button:hover,.views button:hover{color:var(--ink)}
.views{display:flex;flex:none}
.views button{padding-left:14px;padding-right:0}
.views button[aria-pressed=true]{text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--red)}

/* two fields */
.fields{display:grid;grid-template-columns:minmax(0,1.04fr) minmax(0,1fr);min-height:0}
.cat{min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--rule);padding-right:var(--gut)}
.plate{min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;padding-left:var(--gut)}

/* ledger */
.ledger{flex:1;min-height:0;overflow:hidden}
.row{display:grid;grid-template-columns:54px minmax(0,1.5fr) minmax(0,1.15fr) 86px 44px 10px;align-items:center;gap:12px;height:var(--rowh,30px);border-bottom:1px solid var(--rule);cursor:pointer;font-size:12px;width:100%;text-align:left}
.row.head{cursor:default;color:var(--faint);font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;height:30px;border-bottom-color:var(--ink)}
.row .no{color:var(--faint);font-variant-numeric:tabular-nums}
.row .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:400 13px/1 var(--sans);letter-spacing:-.012em}
.row .p,.row .d{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mid)}
.row .y{text-align:right;color:var(--mid);font-variant-numeric:tabular-nums}
.row .c{width:9px;height:9px;justify-self:end}
.row .with{color:var(--faint)}
.row:not(.head):hover{background:#f6f6f4}
.row[aria-current=true]{background:var(--ink);color:var(--paper)}
.row[aria-current=true] :is(.no,.p,.d,.y,.with){color:#bdbcb7}
.pager{display:flex;justify-content:space-between;align-items:center;height:40px;color:var(--mid);font-variant-numeric:tabular-nums;border-top:1px solid var(--ink)}
.pager button{padding:8px 0;min-width:44px}
.pager button:disabled{color:var(--rule);cursor:default}
.pager .next{text-align:right}

/* plates (contact sheet of the whole practice) */
.sheet{flex:1;min-height:0;display:grid;gap:10px;grid-auto-rows:max-content;padding-top:14px;align-content:start;overflow:hidden}
.sheet button{position:relative;aspect-ratio:1;min-width:0;overflow:hidden;display:grid;place-items:center;background:#f7f7f5}
.sheet img{position:absolute;inset:7%;width:86%;height:86%;object-fit:contain;display:block}
.sheet button span{position:absolute;left:0;bottom:0;font-size:8.5px;padding:2px 4px;background:var(--paper);color:var(--ink);font-variant-numeric:tabular-nums;opacity:0}
.sheet button:is(:hover,[aria-current=true]) span{opacity:1}
.sheet.tiny button span{display:none}
.sheet button[aria-current=true]{outline:1px solid var(--ink);outline-offset:3px}
.sheet button:hover img{transform:scale(1.04)}
.sheet img{transition:transform .25s ease}

/* years: the past on the left, seven open years on the right */
.years{flex:1;min-height:0;display:grid;grid-template-rows:auto 1fr auto;padding-top:14px}
.years .note{display:flex;justify-content:space-between;color:var(--mid);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;padding-bottom:10px}
.years .note b{font-weight:400;color:var(--red)}
.ycols{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:3px;align-items:end;min-height:0;border-bottom:1px solid var(--ink);position:relative}
.ycol{display:flex;flex-direction:column-reverse;gap:3px;height:100%;justify-content:flex-start;padding-bottom:3px;position:relative}
.ycol button{width:100%;aspect-ratio:1.6;max-height:24px;flex:none}
.ycol button[aria-current=true]{outline:1px solid var(--ink);outline-offset:1px}
.ycol.future{background:repeating-linear-gradient(to top,transparent 0 26px,var(--rule) 26px 27px)}
.ycol .count{text-align:center;font-size:9px;color:var(--mid);padding-bottom:2px;font-variant-numeric:tabular-nums}
.ylabels{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:3px;padding-top:6px;font-size:9px;color:var(--mid);text-align:center;font-variant-numeric:tabular-nums}
.ylabels .now{color:var(--red)}
.bracket{position:absolute;top:18px;height:8px;border:1px solid var(--red);border-bottom:0}
.bracket span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:9px;color:var(--red);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}

/* plate */
.stage{position:relative;min-height:0;display:grid;place-items:center;padding:clamp(14px,3vh,34px) 0}
.stage img{position:absolute;inset:clamp(14px,3vh,34px) 0;width:100%;height:calc(100% - 2*clamp(14px,3vh,34px));object-fit:contain;display:block;transition:opacity .2s ease}
.stage img.svg{padding:0 15%}
.stage .idle{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint)}
.entry{border-top:1px solid var(--ink);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 24px;padding:12px 0 14px}
.entry .no{font-size:10.5px;color:var(--red);letter-spacing:.04em;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.entry .sq{width:9px;height:9px;display:inline-block}
.step{display:flex;align-items:center;gap:12px;font-variant-numeric:tabular-nums}
.step button{font-size:16px;line-height:1;padding:4px 2px;color:var(--mid)}
.step button:hover{color:var(--ink)}
.view2{display:flex;gap:10px;text-transform:uppercase;letter-spacing:.04em}
.view2 button{color:var(--faint);padding:2px 0}
.view2 button[aria-pressed=true]{color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--red)}
.entry h1{grid-column:1;font:400 clamp(20px,2.1vw,30px)/1.05 var(--sans);letter-spacing:-.035em;margin:2px 0 4px;text-wrap:balance}
.entry .meta{grid-column:1;color:var(--mid);line-height:1.55}
.entry .meta a{border-bottom:1px solid var(--rule)}
.entry .meta a:hover{color:var(--red);border-color:var(--red)}
.entry .side{grid-column:2;grid-row:1/span 3;text-align:right;color:var(--mid);display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:8px;font-size:10.5px}
.state{color:var(--ink)}
.state{text-transform:uppercase;letter-spacing:.04em}
.state.sold::before{content:"● ";color:var(--red)}
.state.available::before{content:"○ ";color:var(--red)}

.foot{padding-right:96px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--rule);color:var(--faint);font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;gap:16px}
.foot a:hover{color:var(--ink)}
.close{display:none}

/* phone: catalogue fills the screen; the plate rises over it */
@media (max-width:820px){
  :root{--bar:50px}
  .app{grid-template-rows:var(--bar) auto minmax(0,1fr) 36px}
  .mast nav{gap:14px;font-size:12px}
  .mast nav .opt{display:none}
  .ctl{flex-direction:column;gap:0}
  .views{border-top:1px solid var(--rule)}
  .views button{padding-left:0;padding-right:14px}
  .fields{grid-template-columns:1fr}
  .cat{border-right:0;padding-right:0}
  .row{grid-template-columns:44px minmax(0,1fr) 40px 9px;gap:10px}
  .row .p,.row .d{display:none}
  .plate{position:fixed;inset:0;z-index:5;background:var(--paper);padding:calc(env(safe-area-inset-top) + 8px) max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 8px) max(16px,env(safe-area-inset-left));transform:translateY(102%);transition:transform .32s cubic-bezier(.2,.7,.2,1);grid-template-rows:auto minmax(0,1fr) auto}
  .plate.open{transform:none}
  .close{display:flex;justify-content:space-between;height:40px;align-items:center;border-bottom:1px solid var(--ink);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
  .close button{padding:10px 0}
  .entry{grid-template-columns:1fr}
  .entry .side{grid-column:1;grid-row:auto;align-items:flex-start;text-align:left}
  .foot .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.study{position:fixed;right:max(var(--gut),env(safe-area-inset-right));bottom:12px;z-index:9;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
.study:hover{color:var(--ink)}
@media (max-width:820px){.study{bottom:calc(env(safe-area-inset-bottom) + 7px)}.foot .loc{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="mast">
    <a class="name" href="#">Cole Calfee</a>
    <nav aria-label="Primary">
      <a href="#" aria-current="page">Index</a>
      <a class="opt" href="https://colecalfee.com/paintings/">Available</a>
      <a href="https://colecalfee.com/info/">Contact</a>
    </nav>
  </header>

  <div class="ctl">
    <div class="filters" role="group" aria-label="Filter by discipline" id="filters"></div>
    <div class="views" role="group" aria-label="View">
      <button type="button" data-view="ledger" aria-pressed="true">Ledger</button>
      <button type="button" data-view="sheet" aria-pressed="false">Plates</button>
      <button type="button" data-view="years" aria-pressed="false">Years</button>
    </div>
  </div>

  <main class="fields">
    <section class="cat" aria-label="Catalogue">
      <div class="ledger" id="ledger"></div>
      <div class="sheet" id="sheet" hidden></div>
      <div class="years" id="years" hidden></div>
      <div class="pager" id="pager">
        <button type="button" class="prev" aria-label="Previous page">←</button>
        <span id="pageno">01 / 01</span>
        <button type="button" class="next" aria-label="Next page">→</button>
      </div>
    </section>

    <section class="plate" id="plate" aria-live="polite" aria-label="Selected work">
      <div class="close"><span id="close-no">—</span><button type="button" id="close">Close ×</button></div>
      <figure class="stage" style="margin:0"><img id="img" alt=""><div class="idle" id="idle">Select a work</div></figure>
      <div class="entry" id="entry"></div>
    </section>
  </main>

  <footer class="foot">
    <span>© 2026 Cole Calfee<span class="loc"> · Nashville, Tennessee / North Georgia</span></span>
    <span class="hint">↑ ↓ select · ← → page</span>
  </footer>
</div>
<a class="study" href="../">↩ Study 01/03</a>

<script src="../media/catalogue.js"></script>
<script>
(()=>{
const C=window.CATALOGUE, P=Object.fromEntries(C.projects.map(p=>[p.id,p]));
const src=(w,s='l',studio)=>'../media/'+(w.src?w.src:s+'/'+w.id+(studio?'-studio':'')+'.webp');
// Every work is numbered by its project: 011.06 = Paintings, sixth work. Studio material files under 000.
const counters={};
const DESIGN=['Record art','Illustration','Identity','Web'];
const works=C.works.map(w=>{
  const p=P[w.project]; const pn=p?p.n:'000';
  counters[pn]=(counters[pn]||0)+1;
  return {...w,no:pn+'.'+String(counters[pn]).padStart(2,'0'),
    short:p?p.short:(w.project==='studio'?'Studio':'Unfiled'),
    own:!p||['paintings','drawings'].includes(p.id),p,
    group:DESIGN.includes(w.discipline)?'Design':w.discipline};
});
// Own work leads: paintings, then drawings, then commissions in index order, studio material last.
const rank=w=>w.project==='paintings'?0:w.project==='drawings'?1:w.p?2:3;
works.sort((a,b)=>rank(a)-rank(b)||(a.no<b.no?-1:1));

const FILTERS=[['All','All'],['Own','Own work'],['Painting','Painting'],['Drawing','Drawing'],['Photography','Photography'],['Design','Design']];
let filter='All', view='ledger', page=0, sel=null, perPage=12, studio=false;
const $=s=>document.querySelector(s);
const list=()=>filter==='All'?works:filter==='Own'?works.filter(w=>w.own):works.filter(w=>w.group===filter);

const fl=$('#filters');
FILTERS.forEach(([f,label])=>{
  const n=f==='All'?works.length:f==='Own'?works.filter(w=>w.own).length:works.filter(w=>w.group===f).length;
  const b=document.createElement('button');b.type='button';b.setAttribute('aria-pressed',f==='All');
  b.innerHTML=label+'<sup>'+n+'</sup>';
  b.onclick=()=>{filter=f;page=0;fl.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));render();};
  fl.appendChild(b);
});
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;page=0;document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',x===b));render();});

function fit(){
  const L=$('#ledger'); const h=L.clientHeight||($('.cat').clientHeight-40)||400; const rh=window.innerWidth<=820?40:Math.max(30,Math.min(38,Math.floor((h-30)/14)));
  document.documentElement.style.setProperty('--rowh',rh+'px');
  perPage=Math.max(4,Math.floor((h-30)/rh));
}
function pager(total){
  const pages=Math.max(1,Math.ceil(total/perPage)); page=Math.min(page,pages-1);
  $('#pageno').textContent=String(page+1).padStart(2,'0')+' / '+String(pages).padStart(2,'0');
  $('#pager .prev').disabled=page===0;$('#pager .next').disabled=page>=pages-1;
  $('#pager').style.visibility=view==='years'?'hidden':'visible';
}
function render(){
  $('#ledger').hidden=view!=='ledger';$('#sheet').hidden=view!=='sheet';$('#years').hidden=view!=='years';
  const items=list();
  if(view==='ledger'){fit();
    const rows=items.slice(page*perPage,(page+1)*perPage);
    $('#ledger').innerHTML='<div class="row head"><span>No.</span><span>Title</span><span class="p">Project</span><span class="d">Discipline</span><span class="y">Year</span><span></span></div>'+
      rows.map(w=>`<button type="button" class="row" data-id="${w.id}" aria-current="${sel&&sel.id===w.id}"><span class="no">${w.no}</span><span class="t">${w.title}</span><span class="p">${w.short}</span><span class="d">${w.discipline}</span><span class="y">${/^\d{4}/.test(w.year)?w.year.slice(0,4):'—'}</span><i class="c" style="background:${w.color}"></i></button>`).join('');
    pager(items.length);
  }
  if(view==='sheet'){
    const S=$('#sheet'); const W=S.clientWidth||600, H=(S.clientHeight||500)-14;
    let best=4; for(let c=3;c<=12;c++){const cell=(W-(c-1)*10)/c; const r=Math.floor((H+10)/(cell+10)); if(r*c>=Math.min(items.length,48)||c===12){best=c;break}}
    const cell=(W-(best-1)*10)/best; const rowsFit=Math.max(1,Math.floor((H+10)/(cell+10)));
    perPage=best*rowsFit; S.style.gridTemplateColumns=`repeat(${best},minmax(0,1fr))`;
    S.classList.toggle('tiny',cell<64);S.innerHTML=items.slice(page*perPage,(page+1)*perPage).map(w=>`<button type="button" data-id="${w.id}" aria-label="${w.no} ${w.title}" aria-current="${sel&&sel.id===w.id}"><img loading="lazy" src="${src(w,'s')}" alt=""><span>${w.no}</span></button>`).join('');
    pager(items.length);
  }
  if(view==='years'){
    const yrs=[];for(let y=2015;y<=2033;y++)yrs.push(String(y));yrs.push('n.d.');
    const yr=w=>/^\d{4}/.test(w.year)?w.year.slice(0,4):'n.d.';
    const n=yrs.length; const Y=$('#years'); Y.style.setProperty('--n',n);
    const first=yrs.indexOf('2027');
    Y.innerHTML=`<div class="note"><span>${items.length} works on record</span><span><b>2027—2033</b> · seven open years</span></div>
      <div class="ycols">${yrs.map(y=>{const ws=items.filter(w=>yr(w)===y);const fut=+y>2026;return `<div class="ycol ${fut?'future':''}">${ws.map(w=>`<button type="button" data-id="${w.id}" aria-label="${w.no} ${w.title}, ${y}" aria-current="${sel&&sel.id===w.id}" style="background:${w.color}"></button>`).join('')}${ws.length?`<span class="count">${ws.length}</span>`:''}</div>`}).join('')}
      <div class="bracket" style="left:calc(${first/n*100}% + 1px);width:calc(${7/n*100}% - 4px)"><span>The next chapter</span></div></div>
      <div class="ylabels">${yrs.map(y=>`<span class="${y==='2026'?'now':''}">${y==='n.d.'?'n.d.':"'"+y.slice(2)}</span>`).join('')}</div>`;
    pager(0);
  }
}
$('#pager .prev').onclick=()=>{page--;render()};
$('#pager .next').onclick=()=>{page++;render()};

function show(w,open,keep){
  if(!keep)studio=false;
  sel=w; const img=$('#img'); $('#idle').hidden=true;
  img.style.opacity=.15; const pre=new Image(); pre.onload=()=>{img.src=pre.src;img.alt=w.alt+(studio?', in the studio':'');img.className=w.src?'svg':'';img.style.opacity=1}; pre.src=src(w,'l',studio&&w.studio);
  const p=w.p; const sibs=p?works.filter(x=>x.project===w.project):[w]; const i=sibs.indexOf(w);
  const who=w.own?'Own work':w.project==='freeman'?'With Freeman General Contracting · Built for Generations':'With '+(p?p.title:w.short);
  $('#entry').innerHTML=`<div class="no"><i class="sq" style="background:${w.color}"></i>${w.no}</div>
   <h1>${w.title}</h1>
   <div class="meta">${w.detail}${/^\d{4}/.test(w.year)?' · '+w.year:''}<br>${who}${p&&p.link?` · <a href="${p.link}" target="_blank" rel="noopener">Visit ↗︎</a>`:''}</div>
   <div class="side">${w.state?`<span class="state ${w.state}">${w.state==='sold'?'Sold':'Available'}</span>`:''}
   ${w.studio?`<span class="view2" role="group" aria-label="Image"><button type="button" data-face="0" aria-pressed="${!studio}">Canvas</button><button type="button" data-face="1" aria-pressed="${studio}">Studio</button></span>`:''}
   ${sibs.length>1?`<span class="step"><button type="button" data-sib="-1" aria-label="Previous in project">‹</button><span>${String(i+1).padStart(2,'0')} / ${String(sibs.length).padStart(2,'0')}</span><button type="button" data-sib="1" aria-label="Next in project">›</button></span>`:''}</div>`;
  $('#entry').querySelectorAll('[data-sib]').forEach(b=>b.onclick=()=>show(sibs[(i+ +b.dataset.sib+sibs.length)%sibs.length]));
  $('#entry').querySelectorAll('[data-face]').forEach(b=>b.onclick=()=>{studio=b.dataset.face==='1';show(sel,false,true)});
  $('#close-no').textContent=w.no;
  document.querySelectorAll('[data-id]').forEach(b=>b.setAttribute('aria-current',b.dataset.id===w.id));
  if(open&&innerWidth<=820)$('#plate').classList.add('open');
  try{history.replaceState(null,'','#'+w.id)}catch(e){}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(!b)return;clearTimeout(hov);show(works.find(w=>w.id===b.dataset.id),true)});
// hover previews on desktop, after a short pause so passing the mouse over rows doesn't flicker
let hov;document.addEventListener('mouseover',e=>{if(innerWidth<=820)return;const b=e.target.closest('.row[data-id],.sheet [data-id]');clearTimeout(hov);if(b&&(!sel||b.dataset.id!==sel.id))hov=setTimeout(()=>show(works.find(w=>w.id===b.dataset.id),false),110)});
$('#close').onclick=()=>$('#plate').classList.remove('open');
document.addEventListener('keydown',e=>{
  const items=list(); if(e.key==='Escape'){$('#plate').classList.remove('open');return}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();let i=sel?items.indexOf(sel):-1;i=Math.max(0,Math.min(items.length-1,i+(e.key==='ArrowDown'?1:-1)));page=Math.floor(i/perPage);render();show(items[i]);}
  if(e.key==='ArrowRight'&&!$('#pager .next').disabled){page++;render()}
  if(e.key==='ArrowLeft'&&!$('#pager .prev').disabled){page--;render()}
});
let t;addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(render,120)});
requestAnimationFrame(()=>{render();if(document.fonts)document.fonts.ready.then(render)});
const start=works.find(w=>w.id===decodeURIComponent(location.hash.slice(1)))||works.find(w=>w.id==='flowers-in-a-jug');
show(start,false);
})();
</script>
</body>
</html>
