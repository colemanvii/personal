<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paintings — Cole Calfee</title><meta name="description" content="Paintings by Cole Calfee. New work and selected archive.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="canonical" href="https://colecalfee.com/paintings/">
<script>try{const t=sessionStorage.getItem('cole-paper-tone-session-v3');document.documentElement.dataset.tone=['off-white','field-notes','violet-hour','red-earth'].includes(t)?t:'off-white'}catch(e){document.documentElement.dataset.tone='off-white'}</script>
<link rel="stylesheet" href="../assets/css/site.css">
<style>
html,body{height:100%;overflow:hidden}
body.gallery{margin:0;height:100dvh;background:var(--paper);color:var(--ink);font-family:var(--mono)}
.gallery .shell{width:calc(100% - 2 * clamp(16px,2vw,32px));max-width:none;height:100dvh;min-height:0;display:flex;flex-direction:column}
.gallery .site-head{flex:none;padding:clamp(13px,2vh,22px) 0;border-bottom:1px solid var(--rule)}
.gallery .brand,.gallery .nav{font:12px/1.4 var(--mono)!important;text-transform:uppercase}
.gallery main{min-height:0;flex:1;display:flex;flex-direction:column;padding:clamp(10px,2vh,22px) 0 12px}
.gallery .topline{flex:none;display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:clamp(10px,2vh,20px)}
.gallery h1{margin:0;font:400 clamp(15px,1.5vw,19px)/1.3 var(--mono)}
.gallery .tabs{display:flex;gap:24px}
.gallery .tabs button{padding:3px 0;background:none;border:0;font:11px/1.4 var(--mono);color:var(--muted);cursor:inherit}
.gallery .tabs button[aria-selected="true"]{color:var(--ink);border-bottom:1px solid currentColor}
.gallery .view{min-height:0;flex:1;display:flex;flex-direction:column}
.gallery .view[hidden]{display:none}
.gallery .new-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(18px,6vw,100px);min-height:0;flex:1;align-items:center;justify-items:center}
.gallery .new-grid article{min-width:0;width:min(100%,390px);display:flex;flex-direction:column}
.gallery .photo{width:100%;aspect-ratio:4/5;max-height:min(55dvh,540px);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.gallery .photo img{width:100%;height:100%;object-fit:cover}
.gallery .photo[hidden]{display:none}
.gallery .name{margin:10px 0 3px;font:400 clamp(13px,1.3vw,17px)/1.2 var(--mono)}
.gallery .meta{font:10px/1.5 var(--mono);text-transform:none;letter-spacing:0;color:var(--muted)}
.gallery .purchase{align-self:flex-start;display:inline-block;margin-top:7px;font:11px/1.3 var(--mono);text-decoration:underline;text-underline-offset:3px}
.gallery [data-checkout][hidden],.gallery [data-pending][hidden]{display:none}
.gallery .archive-grid{min-height:0;flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:clamp(15px,3vw,55px);align-content:start}
.gallery .archive-row{display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:10px;min-width:0;padding:clamp(7px,1.8vh,17px) 0;border-bottom:1px solid var(--rule);font:clamp(10px,1vw,13px)/1.35 var(--mono)}
.gallery .archive-row span:first-child,.gallery .archive-row span:last-child{color:var(--muted);font-size:10px}
.gallery .archive-row .archive-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gallery .archive-row .archive-title:hover{text-decoration:underline;text-underline-offset:3px}
.gallery .archive-status{margin:14px 0 0;font:10px/1.5 var(--mono);color:var(--muted)}
@media(max-width:650px){
.gallery .topline{align-items:center}.gallery .tabs{gap:14px}.gallery .tabs button{font-size:10px}
.gallery .new-grid{gap:12px}.gallery .photo{max-height:min(43dvh,420px)}
.gallery .name{font-size:13px}.gallery .meta{font-size:9px}.gallery .purchase{font-size:10px}
.gallery .archive-grid{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:16px}
.gallery .archive-row{grid-template-columns:18px minmax(0,1fr);gap:4px;padding:clamp(5px,1.3vh,10px) 0;font-size:10px}
.gallery .archive-row span:last-child{display:none}
.gallery .archive-status{font-size:9px}
}
@media(max-height:630px){.gallery .photo{max-height:41dvh}.gallery .archive-row{padding:5px 0}.gallery .archive-status{display:none}}

/* Archival plates: genuine Shopify catalog photos when the storefront permits. */
.gallery .archive-thumbnails{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(10px,1.8vh,22px) clamp(16px,3vw,50px)}
.gallery .archive-card{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:end}
.gallery .archive-art{flex:1;min-height:0;max-height:100%;display:flex;justify-content:center;align-items:center;overflow:hidden}
.gallery .archive-art img{height:100%;width:100%;object-fit:contain}
.gallery .archive-caption{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:6px;font:11px/1.3 var(--mono)}
.gallery .archive-state{color:var(--muted);font-size:10px}
.gallery .archive-pagination{flex:none;display:flex;gap:17px;align-items:center;justify-content:center;padding:clamp(8px,1.5vh,15px) 0 3px;font:10px/1.2 var(--mono);color:var(--muted)}
.gallery .archive-pagination button{border:0;background:none;padding:2px 5px;color:var(--ink);cursor:inherit;font:16px/1 var(--mono)}
.gallery .archive-pagination button:disabled{opacity:.25}
@media(max-width:650px){
.gallery .archive-thumbnails{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:12px}
.gallery .archive-caption{font-size:10px}.gallery .archive-state{font-size:9px}
}
</style></head>
<body class="gallery"><div class="shell">
<header class="site-head"><a class="brand" href="../">Cole Calfee</a><nav class="nav" aria-label="Primary"><a href="../index/">Work index</a><a href="../info/">Info</a></nav></header>
<main>
<div class="topline"><h1>Paintings</h1><div class="tabs" role="tablist" aria-label="Painting collection"><button type="button" role="tab" id="tab-new" aria-controls="panel-new" aria-selected="true">NEW WORK</button><button type="button" role="tab" id="tab-archive" aria-controls="panel-archive" aria-selected="false">ARCHIVE</button></div></div>
<section class="view" id="panel-new" role="tabpanel" aria-labelledby="tab-new">
<div class="new-grid">
<article data-product="flowers"><div class="photo"><img src="../assets/paintings/flowers.jpg" alt="Flowers in McCarty Vase, red painting of flowers" onerror="this.parentElement.hidden=true"></div><h2 class="name">Flowers in McCarty Vase</h2><div class="meta">24 × 30 in. / $1,800</div><a class="purchase" data-checkout hidden rel="noopener noreferrer">Purchase ↗</a><a class="purchase" data-pending href="mailto:hello@colecalfee.com?subject=Flowers%20painting">Inquire ↗</a></article>
<article data-product="red-sea"><div class="photo"><img src="../assets/paintings/red-sea.jpg" alt="Red Sea, crimson abstract painting" onerror="this.parentElement.hidden=true"></div><h2 class="name">Red Sea</h2><div class="meta">36 × 48 in. / $2,400</div><a class="purchase" data-checkout hidden rel="noopener noreferrer">Purchase ↗</a><a class="purchase" data-pending href="mailto:hello@colecalfee.com?subject=Red%20Sea%20painting">Inquire ↗</a></article>
</div></section>
<section class="view" id="panel-archive" role="tabpanel" aria-labelledby="tab-archive" hidden>
<div id="archive-items" class="archive-thumbnails" aria-label="Selected painting archive"></div>
<div id="archive-controls" class="archive-pagination"><button type="button" aria-label="Previous archive page">←</button><span id="archive-count">01 / 02</span><button type="button" aria-label="Next archive page">→</button></div>
</section>
</main></div>
<script src="../assets/js/site.js"></script><script src="./shopify.js"></script><script src="./archive.js"></script>
<script>
(function(){
const tabs=[document.getElementById("tab-new"),document.getElementById("tab-archive")];
const panels=[document.getElementById("panel-new"),document.getElementById("panel-archive")];
function select(i,focus){tabs.forEach((t,j)=>{t.setAttribute("aria-selected",String(i===j));t.tabIndex=i===j?0:-1;panels[j].hidden=i!==j});if(focus)tabs[i].focus();history.replaceState(null,"",i===1?"#archive":location.pathname)}
tabs.forEach((t,i)=>{t.addEventListener("click",()=>select(i,false));t.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key==="ArrowRight"){e.preventDefault();select((i+(e.key==="ArrowRight"?1:tabs.length-1))%tabs.length,true)}})});
select(location.hash==="#archive"?1:0,false);
})();
</script></body></html>
