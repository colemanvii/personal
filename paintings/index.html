<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>New Paintings — Cole Calfee</title>
<meta name="description" content="Original oil paintings currently available from Cole Calfee.">
<link rel="canonical" href="https://colecalfee.com/paintings/">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script>try{const t=sessionStorage.getItem('cole-paper-tone-session-v3');document.documentElement.dataset.tone=['off-white','field-notes','violet-hour','red-earth'].includes(t)?t:'off-white';}catch(e){document.documentElement.dataset.tone='off-white';}</script>
<link rel="stylesheet" href="../assets/css/site.css">
<style>
.paintings{min-height:100dvh;font-family:var(--mono)}
.paintings .shell{max-width:1160px}
.paintings .site-head{align-items:baseline}
.paintings main{flex:1;padding:clamp(44px,7vw,96px) 0 96px}
.paintings .intro{display:flex;justify-content:space-between;align-items:end;gap:24px;border-bottom:1px solid var(--rule);padding-bottom:24px;margin-bottom:clamp(44px,7vw,96px)}
.paintings h1{font:400 clamp(34px,6vw,78px)/1 var(--display);letter-spacing:-.05em;margin:0}
.paintings .intro small,.paintings .detail,.paintings .note{font:11px/1.6 var(--mono);text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.paintings .catalog{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(24px,5vw,80px)}
.paintings article{min-width:0}
.paintings .work-image{aspect-ratio:3/4;display:flex;justify-content:center;align-items:center;background:transparent;border:1px solid var(--rule);overflow:hidden}
.paintings .work-image img{width:100%;height:100%;object-fit:contain}
.paintings .work-image .missing{padding:28px;text-align:center;color:var(--muted);font:11px/1.6 var(--mono)}
.paintings .work-title{font:400 clamp(23px,3vw,40px)/1.1 var(--display);letter-spacing:-.04em;margin:18px 0 5px}
.paintings .spec{display:flex;flex-wrap:wrap;justify-content:space-between;gap:7px 16px}
.paintings .detail{margin:0}
.paintings .action{display:inline-block;margin-top:20px;padding:9px 0;border-bottom:1px solid var(--ink);font:12px/1.4 var(--mono);letter-spacing:.015em}
.paintings .action:hover,.paintings .action:focus-visible{background:var(--ink);color:var(--paper);outline:0;box-shadow:0 0 0 5px var(--ink)}
.paintings .action[hidden],.paintings .work-image img[hidden],.paintings .work-image[hidden]{display:none}
.paintings .availability{font:10px/1.5 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-top:20px}
.paintings .note{max-width:520px;margin-top:70px;text-transform:none}
@media(max-width:650px){.paintings .catalog{grid-template-columns:1fr;gap:65px}.paintings .intro{display:block}.paintings .intro small{display:block;margin-top:18px}.paintings main{padding-top:48px}.paintings .work-image{aspect-ratio:4/5}.paintings .site-head{display:flex;align-items:baseline}.paintings .nav{margin-left:auto}}

/* Fixed-screen composition: the entire release is visible without page scrolling. */
html:has(body.paintings),body.paintings{height:100%;overflow:hidden}
.paintings{height:100dvh;min-height:0;overflow:hidden}
.paintings .shell{height:100dvh;min-height:0;max-width:none;display:flex;flex-direction:column}
.paintings .site-head{flex:0 0 auto}
.paintings main{min-height:0;flex:1;display:flex;flex-direction:column;padding:clamp(12px,2.8dvh,30px) 0 clamp(8px,1.5dvh,18px)}
.paintings .intro{flex:0 0 auto;margin:0 0 clamp(10px,2dvh,24px);padding:0 0 clamp(10px,1.6dvh,18px);align-items:baseline}
.paintings h1{font:400 clamp(15px,1.55vw,23px)/1.25 var(--mono);letter-spacing:-.035em}
.paintings .catalog{min-height:0;flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,4vw,64px)}
.paintings article{min-height:0;display:flex;flex-direction:column}
.paintings .work-image{flex:1;min-height:0;aspect-ratio:auto;border:0}
.paintings .work-image img{width:100%;height:100%;object-fit:contain}
.paintings .work-title{font:400 clamp(15px,1.65vw,23px)/1.15 var(--mono);letter-spacing:-.035em;margin:8px 0 3px}
.paintings .detail{font-size:clamp(9px,.77vw,11px)}
.paintings .action{margin-top:6px;padding:4px 0;font-size:11px;align-self:flex-start}
.paintings .availability{margin-top:7px}
.paintings .note{flex:0 0 auto;margin:clamp(8px,1.4dvh,16px) 0 0;font-size:10px;line-height:1.35}
.paintings .footer{flex:0 0 auto;padding:clamp(6px,1dvh,12px) 0}
@media(max-width:650px){
 .paintings .shell{width:calc(100% - 28px)}
 .paintings .site-head{display:flex;gap:8px;align-items:center}
 .paintings .nav{gap:10px;margin-left:auto;font-size:10px!important}
 .paintings .brand{font-size:11px!important}
 .paintings main{padding-top:12px;padding-bottom:8px}
 .paintings .intro{display:flex;gap:12px;margin-bottom:12px;align-items:baseline}
 .paintings .intro small{margin:0;font-size:8px}
 .paintings .catalog{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
 .paintings .work-image{aspect-ratio:auto}
 .paintings .work-title{font-size:14px;margin-top:7px}
 .paintings .spec{display:block}
 .paintings .detail{font-size:9px;line-height:1.3}
 .paintings .detail:nth-child(2){display:none}
 .paintings .action{font-size:10px;line-height:1.3}
 .paintings .note{font-size:9px}
 .paintings .footer{font-size:9px}
}
@media(max-height:560px){
 .paintings .intro{margin-bottom:6px;padding-bottom:6px}
 .paintings .note{display:none}
 .paintings .work-title{margin-top:4px}
 .paintings .detail:nth-child(2){display:none}
}

/* Study 02 — smaller 4:5 photographic plates, aligned as a single exhibition. */
.paintings .catalog{align-items:start;align-content:center;justify-items:center;gap:clamp(24px,5vw,90px)}
.paintings article{width:100%;max-width:440px;min-height:0;align-self:center}
.paintings .work-image{
  flex:none;width:auto;height:auto;
  aspect-ratio:4/5;max-width:100%;
  max-height:min(55dvh,570px);
  margin:0 auto 12px;overflow:hidden;
}
.paintings .work-image img{width:100%;height:100%;object-fit:cover;object-position:center}
.paintings .work-title{margin-top:0}
@media(max-width:650px){
 .paintings .catalog{gap:clamp(12px,3vw,24px);align-content:center}
 .paintings article{max-width:100%;align-self:center}
 .paintings .work-image{aspect-ratio:4/5;max-height:min(47dvh,450px);margin-bottom:9px}
}
@media(max-height:650px){
 .paintings .work-image{max-height:46dvh}
 .paintings .note{display:none}
}

/* Essentials only: artwork, name, dimensions, price and purchase. */
.paintings .intro{border-bottom:0}
.paintings .site-head{border-bottom:0}
.paintings .catalog{align-content:center}
.paintings .work-title{margin:5px 0 3px}
.paintings .spec{display:block}
.paintings .detail{color:var(--muted)}
.paintings .action{border-bottom:0;text-decoration:underline;text-underline-offset:4px}
</style>
</head>
<body class="paintings">
<div class="shell">
<header class="site-head">
<a class="brand" href="../">Cole Calfee</a>
<nav class="nav" aria-label="Primary"><a href="../index/">Work index</a><a href="../info/">Info</a></nav>
</header>
<main>
<div class="intro"><h1>New Paintings</h1></div>
<section class="catalog" aria-label="New original paintings">
<article data-product="flowers">
<div class="work-image"><img src="../assets/paintings/flowers.jpg" alt="Flowers, an original red painting with a vase of flowers" loading="lazy" onerror="this.parentElement.hidden=true"><span class="missing" hidden>Photograph forthcoming</span></div>
<h2 class="work-title">Flowers</h2>
<div class="spec"><p class="detail">24 × 30 in. · $1,800</p></div>
<a class="action" data-checkout hidden rel="noopener noreferrer">Purchase ↗</a>
<p class="availability" data-pending>To purchase, <a href="mailto:hello@colecalfee.com?subject=Flowers%20painting%20inquiry" style="text-decoration:underline;text-underline-offset:3px">inquire by email ↗</a></p>
</article>
<article data-product="red-sea">
<div class="work-image"><img src="../assets/paintings/red-sea.jpg" alt="Red Sea, a large original red abstract painting" loading="lazy" onerror="this.parentElement.hidden=true"><span class="missing" hidden>Photograph forthcoming</span></div>
<h2 class="work-title">Red Sea</h2>
<div class="spec"><p class="detail">36 × 48 in. · $2,400</p></div>
<a class="action" data-checkout hidden rel="noopener noreferrer">Purchase ↗</a>
<p class="availability" data-pending>To purchase, <a href="mailto:hello@colecalfee.com?subject=Red%20Sea%20painting%20inquiry" style="text-decoration:underline;text-underline-offset:3px">inquire by email ↗</a></p>
</article>
</section>
</main>

</div>
<script src="../assets/js/site.js"></script>
<script src="./shopify.js"></script>
</body></html>
