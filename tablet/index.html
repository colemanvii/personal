<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>TABLET</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='3' width='18' height='26' rx='2' fill='%23fff' stroke='%23111' stroke-width='2'/%3E%3Cpath d='M11 10h10M11 15h10M11 20h6' stroke='%23111' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="tablet.css">
</head>
<body>
<div class="wall">
  <header class="rail">
    <div class="mark"><span class="word">TABLET</span><span class="sub">cave wall</span></div>
    <div class="today" id="today"></div>
    <nav class="acts">
      <input id="find" class="find" type="search" placeholder="find" aria-label="Find on the tablet" autocomplete="off">
      <button id="inboxBtn" class="act" hidden>Inbox <span id="inboxCount"></span></button>
      <button id="archiveBtn" class="act" aria-pressed="false">Archive</button>
      <button id="moreBtn" class="act" aria-haspopup="menu" aria-expanded="false">•••</button>
      <button id="captureBtn" class="act primary">Capture</button>
    </nav>
    <div id="moreMenu" class="menu" role="menu" hidden>
      <button role="menuitem" data-cmd="export-json">Export backup (.json)</button>
      <button role="menuitem" data-cmd="export-md">Export readable (.md)</button>
      <button role="menuitem" data-cmd="import">Import backup…</button>
      <button role="menuitem" data-cmd="archive">Show / hide archive</button>
      <button role="menuitem" data-cmd="add-project">Add project…</button>
      <button role="menuitem" data-cmd="bridge">Connect ChatGPT…</button>
    </div>
  </header>

  <main id="board" class="board" aria-label="Projects"></main>

  <footer class="foot"><span id="saved">—</span><span id="where"></span></footer>
</div>

<div id="scrim" class="scrim" hidden></div>
<aside id="slab" class="slab" hidden aria-modal="true" role="dialog" aria-labelledby="slabTitle">
  <div class="slab-head">
    <h2 id="slabTitle">Capture</h2>
    <button class="x" id="closeSlab" aria-label="Close">×</button>
  </div>
  <div id="slabBody" class="slab-body"></div>
</aside>

<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="exportFile" accept="application/json,.json" hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="src/app.js"></script>
</body>
</html>
