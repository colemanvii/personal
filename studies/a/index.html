<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f3f2ee">
<title>Cole Calfee</title>
<style>
/* A — Personal Address. One field, two groups on one line. */
html{background:#f3f2ee;color:#1c1c1a;font:15px/1.45 "Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;grid-template-columns:12.5vw 1fr auto 12.5vw;grid-template-rows:44fr auto 56fr;align-items:baseline}
h1{grid-area:2/2;margin:0;font-size:1.6rem;font-weight:400;letter-spacing:-.005em}
dl{grid-area:2/3;margin:0;display:grid;grid-template-columns:auto auto;column-gap:.85em;row-gap:.5em;font-size:.875rem}
dt{color:#6c6b66;text-align:right}
dd{margin:0}
dd a{display:block;width:max-content}
a{color:inherit;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.2em;text-decoration-color:#a9a8a1}
a:hover{text-decoration-color:currentColor}
a:focus-visible{outline:2px solid currentColor;outline-offset:3px;text-decoration:none}

/* Phone: the envelope. Name where the sender writes; the index where the address goes. */
@media (max-width:640px){
  body{grid-template-columns:28px 1fr 28px;grid-template-rows:31svh auto 1fr auto 9svh}
  h1{grid-area:2/2;font-size:1.4rem}
  dl{grid-area:4/2;justify-self:end;font-size:.9375rem;row-gap:.45em}
}
</style>
</head>
<body>
<h1>Cole Calfee</h1>
<dl>
<dt>work</dt>
<dd><a href="https://colecalfee.com/index/">index</a><a href="https://colecalfee.com/work/paintings/">paintings</a><a href="https://colecalfee.com/work/drawings/">drawings</a></dd>
<dt>email</dt>
<dd><a href="mailto:colecalfee@gmail.com">colecalfee@gmail.com</a></dd>
<dt>elsewhere</dt>
<dd><a href="https://www.instagram.com/colecalfee/">Instagram</a><a href="https://www.freemangc.com/">Freeman</a></dd>
</dl>
</body>
</html>
