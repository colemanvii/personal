<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f1f0ec">
<title>Cole Calfee</title>
<link rel="preload" as="image" href="truck-800.webp" imagesrcset="truck-480.webp 480w, truck-800.webp 800w, truck-1200.webp 1200w" imagesizes="(max-width:640px) 60vw, 37svh">
<style>
/* F — One Photograph. A small print on a large wall: the name hangs from its top edge,
   the index stands on its bottom edge. The photograph is changed by hand, rarely. */
html{background:#f1f0ec;color:#1c1c1a;font:14px/1.5 "Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;grid-template-columns:12.5vw 1fr auto 1fr 12.5vw;grid-template-rows:42fr auto 58fr}
h1,p,ul{margin:0;padding:0;font:inherit;list-style:none}
header{grid-area:2/2;align-self:start}
figure{grid-area:2/3;margin:0;position:relative}
img{display:block;height:46svh;width:auto;aspect-ratio:4/5;background:#d9d6cf}
figcaption{position:absolute;top:100%;left:0;padding-top:.7em;font-size:12px;color:#6c6b66;white-space:nowrap}
nav{grid-area:2/4;align-self:end;justify-self:end;text-align:right}
nav ul+ul{margin-top:1.5em}
.where{color:#6c6b66}
a{color:inherit;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.2em;text-decoration-color:#b3b1aa}
a:hover{text-decoration-color:currentColor}
a:focus-visible{outline:2px solid currentColor;outline-offset:3px}
figcaption a{text-decoration-color:#c9c7c0}
@media (max-width:640px){
  html{font-size:15px}
  body{grid-template-columns:24px 1fr 24px;grid-template-rows:24px auto 1fr auto 1fr auto 30px}
  header{grid-area:2/2}
  figure{grid-area:4/2;justify-self:end}
  img{height:auto;width:60vw}
  nav{grid-area:6/2;justify-self:start;text-align:left}
}
</style>
</head>
<body>
<header>
<h1>Cole Calfee</h1>
<p class="where">Nashville, Tennessee<br>North Georgia</p>
</header>
<figure>
<img src="truck-800.webp" srcset="truck-480.webp 480w, truck-800.webp 800w, truck-1200.webp 1200w" sizes="(max-width:640px) 60vw, 37svh" width="800" height="1000" alt="A pickup truck, very small, crossing a wide plain of dry grass and dirt tracks.">
<figcaption><a href="https://colecalfee.com/work/teton-valley-ranch/">Teton Valley Ranch</a>, 2015</figcaption>
</figure>
<nav aria-label="Site">
<ul>
<li><a href="https://colecalfee.com/index/">Index</a></li>
<li><a href="https://colecalfee.com/work/paintings/">Paintings</a></li>
<li><a href="https://colecalfee.com/work/drawings/">Drawings</a></li>
<li><a href="https://colecalfee.com/available/">Available</a></li>
</ul>
<ul>
<li><a href="mailto:colecalfee@gmail.com">colecalfee@gmail.com</a></li>
<li><a href="https://www.instagram.com/colecalfee/">Instagram</a></li>
</ul>
</nav>
</body>
</html>
